</div><div id="unowned"><button data-probe="unowned">Host control</button></div><pre id="result">RUNNING</pre>
<script type="module">
const assert=(ok,text)=>{if(!ok)throw Error(text)},settle=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
try {
 const preview=new URLSearchParams(location.search).get('preview');document.querySelector('#native-css').href=new URL('app.css',preview);document.querySelector('#heatmap-css').href=new URL('heatmap.css',preview);await new Promise(r=>setTimeout(r,150));await document.fonts.ready;
 const modules={};async function load(name,dependencies={}) {const m={exports:{}};new Function('module','exports','require',await(await fetch('../'+name+'.js')).text())(m,m.exports,key=>{if(!(key in dependencies))throw Error('Missing test dependency '+key);return dependencies[key]});return m.exports;}
 const palettes=await load('ui/color-palettes'), colors=await load('ui/color-system',{'./color-palettes':palettes}), attention=await load('ui/attention',{'./color-system':colors});
 const gallery=document.querySelector('#gallery'),heat=document.querySelector('#heat');document.body.className='theme-dark';colors.ownColorRoot(gallery);
 const progress=await load('ui/progress-colors');for(let q=4;q<=16;q++){const cell=document.createElement('li');cell.className='sample';cell.dataset.probe='heat-'+q;cell.style.backgroundColor=progress.progressColor(q/4);heat.append(cell);}
 const nested=document.createElement('section');nested.className='hub-color-scope';nested.innerHTML='<button class="mod-cta" data-probe="nested">Nested action</button>';gallery.append(nested);
 const pageRoots=['home-dashboard','project-dashboard','hub-athena-view','hub-color-page','daily-project-list'].map(cls=>{const e=document.createElement('div');e.className=cls;e.textContent='Owned page';gallery.append(e);colors.ownColorRoot(e);return e;});
 const sidebar=document.createElement('button');sidebar.className='hub-settings-category';sidebar.setAttribute('aria-selected','true');sidebar.textContent='Selected settings';sidebar.dataset.probe='sidebar';gallery.append(sidebar);
 const popup=document.createElement('div');popup.className='tooltip hub-color-scope';popup.textContent='Native tooltip marker';document.body.append(popup);
 const island=document.createElement('div');island.innerHTML='<button aria-label="Host">Host island</button>';gallery.append(island);const releaseIsland=colors.hostColorIsland(island);
 const read=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return {color:s.color,background:s.backgroundColor,border:s.borderColor,shadow:s.boxShadow,fill:s.fill,stroke:s.stroke,opacity:s.opacity,width:r.width,height:r.height}};
 const snapshot=()=>Object.fromEntries([...gallery.querySelectorAll('[data-probe]')].map(e=>[e.dataset.probe,read(e)]));
 const same=(a,b,msg)=>assert(JSON.stringify(a)===JSON.stringify(b),msg);
 const pointer=e=>new Promise(resolve=>{e.scrollIntoView({block:'center'});const r=e.getBoundingClientRect();window.hubTestPointerDone=resolve;window.hubTestPointerRequest={x:r.left+r.width/2,y:r.top+r.height/2,action:'move'}});
 const capture=name=>new Promise(resolve=>{window.hubTestScreenshotDone=resolve;window.hubTestScreenshotRequest=name});
 const canvas=document.createElement('canvas');canvas.width=canvas.height=1;const ctx=canvas.getContext('2d');
 function rgb(value,bg){ctx.clearRect(0,0,1,1);ctx.fillStyle=bg||'#000000';ctx.fillRect(0,0,1,1);ctx.fillStyle=value;ctx.fillRect(0,0,1,1);return '#'+[...ctx.getImageData(0,0,1,1).data].slice(0,3).map(x=>x.toString(16).padStart(2,'0')).join('');}
 await settle();const pageBaselines=pageRoots.map(e=>getComputedStyle(e).backgroundColor);const baseline=snapshot(),host=read(document.querySelector('#unowned button')),islandBefore=read(island.firstChild),evidence={};let comparisons=0;
 for(const palette of palettes.PALETTES) for(const full of [false,true]) {
  colors.applyResolvedColors(palettes.resolvePalette({version:1,paletteId:palette.id,coordinateInterfaceColors:full}));await settle();
  const current=snapshot();for(const root of pageRoots){const bg=getComputedStyle(root).backgroundColor;if(full&&palette.id!=='default')assert(rgb(bg)===palette.coordinated['--hub-palette-neutral-00'],'Transparent page backdrop '+root.className);else assert(bg===pageBaselines[pageRoots.indexOf(root)],'Default/accent-only page background changed '+root.className);}same(read(document.querySelector('#unowned button')),host,'Host recolored');same(read(island.firstChild),islandBefore,'Island recolored');
  assert(!island.firstChild.getAttribute('data-tooltip-classes')?.includes('hub-color-scope'),'Island tooltip ownership');
  for(const [id,value]of Object.entries(current)){same([value.width,value.height],[baseline[id].width,baseline[id].height],id+' geometry');comparisons++;}
  for(const id of ['must','should','overdue','project-series','resource-series','task-series','step-series',...Array.from({length:13},(_,i)=>'heat-'+(i+4))]){const key=id==='overdue'?'color':id.includes('series')?'fill':'background';same(current[id][key],baseline[id][key],id+' semantic/heatmap change');};
  if(!full)for(const id of ['oath-active','oath-action','pinned-title','phase-first','phase-mid'])same(current[id],baseline[id],id+' accent-only specialized change');
  if(palette.id!=='default') {
   const cta=gallery.querySelector('[data-probe=cta]'),normal=read(cta);assert(palettes.contrast(rgb(normal.color),rgb(normal.background))>=4.5,palette.id+' primary contrast');
   await pointer(cta);await settle();const hovered=read(cta);assert(palettes.contrast(rgb(hovered.color),rgb(hovered.background))>=4.5,palette.id+' primary hover contrast');assert(palettes.luminance(rgb(hovered.background))>palettes.luminance(rgb(normal.background)),palette.id+' brighter hover');same(normal.color,hovered.color,'Foreground swap');
   await pointer(gallery.querySelector('h2'));await settle();
   const selected=read(gallery.querySelector('[data-probe=option]'));assert(palettes.contrast(rgb(selected.color),rgb(selected.background))>=4.5,palette.id+' filled selection');
   const side=read(sidebar),page=getComputedStyle(gallery).getPropertyValue('--background-primary');assert(palettes.contrast(rgb(side.color),rgb(side.background,page))>=4.5,palette.id+' sidebar label');
   assert(read(nested.querySelector('button')).background===normal.background,'Nested root defaults override palette');
   const marker=getComputedStyle(popup).getPropertyValue('--hub-color-accent');assert(marker===getComputedStyle(gallery).getPropertyValue('--hub-color-accent'),'Marker-only native tooltip stale');
  }
  evidence[palette.id+'-'+full]=current;
  if(full){gallery.scrollIntoView();await capture('palette-'+palette.id);}
 }
 colors.applyResolvedColors(palettes.resolvePalette(palettes.DEFAULT_PREFERENCES));await pointer(gallery.querySelector('h2'));await settle();for(const [id,record]of Object.entries(snapshot()))for(const [key,value]of Object.entries(record))same(value,baseline[id][key],'Default return '+id+' '+key+': '+value+' vs '+baseline[id][key]);
 document.body.className='theme-light';await settle();const light=snapshot();
 for(const p of palettes.PALETTES){colors.applyResolvedColors(palettes.resolvePalette({version:1,paletteId:p.id,coordinateInterfaceColors:true}));await settle();same(snapshot(),light,'Light changed with '+p.id);}
 document.body.className='theme-dark';await settle();const effects=attention.mountTransientEffects(gallery),target=gallery.querySelector('[data-probe=button]');effects.run(target,'hub-attention');await settle();assert(target.hasAttribute('data-hub-attention-surface'),'Effect not sampled');colors.applyResolvedColors(palettes.resolvePalette({version:1,paletteId:'amber',coordinateInterfaceColors:true}));assert(!target.hasAttribute('data-hub-attention-surface'),'Stale sampled effect');effects.run(target,'hub-attention');await settle();effects.cancelAll();effects.destroy();
 const frame=document.createElement('iframe');document.body.append(frame);await new Promise(r=>setTimeout(r,30));const doc=frame.contentDocument;doc.body.className='theme-dark';const node=doc.createElement('div');doc.body.append(node);const release=colors.ownColorRoot(node);assert(doc.querySelectorAll('[data-hub-palette]').length===1,'Secondary sheet missing');assert(getComputedStyle(gallery).getPropertyValue('--hub-palette-neutral-00').trim()===doc.defaultView.getComputedStyle(node).getPropertyValue('--hub-palette-neutral-00').trim(),'Secondary document stale');release();frame.remove();
 for(let i=0;i<30;i++)colors.applyResolvedColors(palettes.resolvePalette({version:1,paletteId:palettes.PALETTES[i%5].id,coordinateInterfaceColors:!!(i%2)}));assert(document.querySelectorAll('[data-hub-palette]').length===1,'Accumulating styles');
 window.hubTaskOpeningFrames=evidence;releaseIsland();colors.disposeColorSystem();assert(!document.querySelector('[data-hub-palette]'),'Sheet leak');
 document.querySelector('#result').textContent='PASS '+comparisons+' palette geometry comparisons; 10 contracts, rendered action/selection contrast, native marker tooltip, nested roots, semantic and all 13 heatmap levels, exact Default return/Light, host/island isolation, effect cancellation, repeated switching and secondary document';
}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;}
</script>
