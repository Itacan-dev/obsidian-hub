<!doctype html><meta charset="utf-8"><title>Itacan Stage 1 color consistency</title>
<link id="native-css" rel="stylesheet"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../../../../System/Dashboards/Home/view.css"><link rel="stylesheet" href="../../../../../System/Dashboards/Project/view.css">
<style>body{overflow:auto!important}#gallery{padding:20px;width:1100px}#gallery,#gallery *{transition:none!important;animation:none!important}#gallery>section{padding:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#gallery .hub-task-necessity-bar{display:inline-block;position:static;width:10px;height:22px}#gallery .hub-roadmap-phase-bar{position:static}#gallery #heat-colors{display:flex;gap:2px}#gallery #heat-colors>span{width:20px;height:20px}#result{position:fixed;bottom:0;pointer-events:none;z-index:99999}</style>
<pre id="result">RUNNING</pre><script type="module">
try{
 const preview=new URLSearchParams(location.search).get('preview'),captureOnly=new URL(preview).hash==='#capture';document.getElementById('native-css').href=new URL('app.css',preview);
 const load=async file=>{const m={exports:{}};new Function('module','exports',await(await fetch(file)).text())(m,m.exports);return m.exports},colors=await load('../ui/color-system.js'),progress=await load('../ui/progress-colors.js'),tests=await load('color-consistency-checks.js');const gallery=tests.createColorConsistencyGallery(document);gallery.id='gallery';document.body.prepend(gallery);
 for(let q=4;q<=16;q++){const e=document.createElement('span');e.dataset.c='heat-'+q;e.style.backgroundColor=progress.progressColor(q/4);gallery.querySelector('#heat-colors').append(e)}
 const wait=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await document.fonts.ready;await new Promise(r=>setTimeout(r,100));
 const pointer=async(e,action='move')=>{e.scrollIntoView({block:'center'});await wait();return new Promise(r=>{const b=e.getBoundingClientRect();window.hubTestPointerDone=r;window.hubTestPointerRequest={x:b.x+b.width/2,y:b.y+b.height/2,action}})},capture=name=>new Promise(r=>{window.hubTestScreenshotDone=r;window.hubTestScreenshotRequest=name});const states={};
 for(const mode of ['dark','light']){document.body.className='theme-'+mode;const dispose=colors.ownColorRoot(gallery);await pointer(document.body);await wait();states[mode]=tests.consistencySnapshot(gallery);await capture('consistency-'+(captureOnly?'before':'after')+'-'+mode);
  for(const id of ['music','statistics','workspace','ordinary-action','task-action','inbox-action']){await pointer(gallery.querySelector('[data-c="'+id+'"]'));await wait();states[mode+'-hover-'+id]=tests.consistencySnapshot(gallery)}
  gallery.querySelector('[data-c=date]').focus();await wait();states[mode+'-focus']=tests.consistencySnapshot(gallery);document.activeElement.blur();dispose();}
 // A host may intentionally distinguish semantic and primitive colors in Light.
 const releaseLight=colors.ownColorRoot(gallery);document.body.style.setProperty('--text-error','rgb(20, 180, 160)');document.body.style.setProperty('--color-red','rgb(220, 50, 80)');document.body.style.setProperty('--text-warning','rgb(160, 100, 210)');document.body.style.setProperty('--color-orange','rgb(210, 120, 40)');await wait();states['light-host']=tests.consistencySnapshot(gallery);releaseLight();document.body.removeAttribute('style');
 window.hubTaskOpeningFrames=states;
 if(captureOnly){document.getElementById('result').textContent='PASS captured Stage 1 pre-change Default colors';}
 else{const golden=await(await fetch('color-consistency-baseline.json')).json();golden.states=(await load('color-stage2-checks.js')).applyApprovedStage2Changes(golden.states,'consistency',await(await fetch('color-stage2-expectations.json')).json());let comparisons=0;for(const [state,probes]of Object.entries(golden.states))for(const [id,properties]of Object.entries(probes))for(const [key,value]of Object.entries(properties)){if(states[state][id][key]!==value)throw Error(state+' '+id+' '+key+': '+states[state][id][key]+' != '+value);comparisons++}
  document.body.className='theme-dark';const dispose=colors.ownColorRoot(gallery);const checks=await tests.checkColorConsistency(gallery,colors);
  for(const id of ['music','statistics','workspace']){gallery.style.setProperty('--hub-color-surface-button-hover','rgb(20, 170, 210)');await pointer(gallery.querySelector('[data-c="'+id+'"]'));await wait();if(tests.consistencySnapshot(gallery)[id].background!=='rgb(20, 170, 210)')throw Error(id+' real hover did not follow the button-hover role');gallery.removeAttribute('style');}
  const date=gallery.querySelector('[data-c=datetime]');date.scrollIntoView({block:'center'});gallery.style.setProperty('--hub-color-text-muted','rgb(0, 255, 255)');await wait();const image=await capture('consistency-date-punctuation');const img=new Image();img.src='data:image/png;base64,'+image;await img.decode();const canvas=document.createElement('canvas');canvas.width=img.width;canvas.height=img.height;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);const b=date.getBoundingClientRect(),pixels=ctx.getImageData(Math.floor(b.x*devicePixelRatio),Math.floor(b.y*devicePixelRatio),Math.floor(b.width*devicePixelRatio),Math.floor(b.height*devicePixelRatio)).data;let cyan=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i]<30&&pixels[i+1]>200&&pixels[i+2]>200)cyan++;if(!cyan)throw Error('Date punctuation did not paint the owned muted color');gallery.removeAttribute('style');dispose();document.getElementById('result').textContent='PASS '+comparisons+' Dark/Light color and geometry comparisons with reviewed Stage 2 deltas; '+checks+' semantic/isolation assertions; native dropdown hover and date-punctuation pixels';}
}catch(e){document.getElementById('result').textContent='FAIL '+e.stack}
</script>
