<!doctype html>
<meta charset="utf-8">
<title>Itacan typography regression checks</title>
<style id="native-host">
/* Portable native host. Production styles and renderers own the tested UI. */
:root { font-size:16px; --font-ui-small:13px; --font-ui-smaller:12px; --font-ui-medium:15px; --h2-size:1.462em; --input-height:30px; }
* { box-sizing:border-box; }
body { margin:20px; font:15px/1.3 "Segoe UI",sans-serif; color:var(--text-normal); background:var(--background-primary); --interactive-accent:#8955ed; --text-on-accent:white; }
body.theme-dark { --background-primary:#1c1c1c; --background-secondary:#282828; --background-modifier-border:#404040; --background-modifier-hover:#ffffff08; --text-normal:#dadada; --text-muted:#b3b3b3; --text-faint:#666; }
body.theme-light { --background-primary:#fff; --background-secondary:#f6f6f6; --background-modifier-border:#ddd; --background-modifier-hover:#00000008; --text-normal:#222; --text-muted:#5c5c5c; --text-faint:#ababab; }
button,input,textarea,select { font-family:inherit; font-size:var(--font-ui-small); line-height:normal; height:var(--input-height); color:inherit; background:var(--background-primary); border:1px solid var(--background-modifier-border); border-radius:5px; padding:4px 12px; }
button:disabled { opacity:.5; }
.markdown-rendered { line-height:1.5; }
h1 { font-size:2em; font-weight:700; line-height:1.2; letter-spacing:-.015em; }
h2 { font-size:var(--h2-size); font-weight:680; line-height:1.2; letter-spacing:-.011em; }
.modal-content { font-size:var(--font-ui-medium); }
.heatmap-calendar-graph { font-size:.65em; }
</style>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../../../../System/Dashboards/Home/view.css">
<link rel="stylesheet" href="../../../../../System/Dashboards/Project/view.css">
<link rel="stylesheet" href="../../../../../System/Dashboards/Daily/view.css">
<style>
/* Fixtures use document scrolling instead of Obsidian's workspace shell. */
body { display:block; position:relative; height:auto; min-height:100vh; overflow:auto; margin:20px; }
#fixtures > .modal { position:relative; inset:auto; margin:20px 0; width:650px; padding:16px; height:auto; }
#fixtures > .hub-oath-workspace-picker { width:960px; }
#fixtures > .hub-oath-workspace-picker .modal-content { width:920px; }
#result { white-space:pre-wrap; }
</style>
<body class="theme-dark">
<button id="native-button">Native control</button>
<div id="fixtures"></div>
<pre id="result">RUNNING</pre>
<script>
window.addEventListener("error", event => { document.getElementById("result").textContent = "ERROR " + event.message; });
window.addEventListener("unhandledrejection", event => { document.getElementById("result").textContent = "ERROR " + event.reason?.stack; });
</script>
<script src="typography-browser.js"></script>
