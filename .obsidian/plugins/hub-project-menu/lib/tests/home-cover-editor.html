<style>

</style><div id="home" class="home-dashboard hub-button-scope"><div id="cover" class="home-cover"><img class="home-cover-image"></div></div><pre id="result">RUNNING</pre>
<script type="module">
const check=(ok,message)=>{if(!ok)throw Error(message)},frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));

HTMLElement.prototype.createDiv=function(o){return this.createEl('div',o)};HTMLElement.prototype.createSpan=function(o){return this.createEl('span',o)};HTMLElement.prototype.empty=function(){this.replaceChildren()};
let menu;class Menu{constructor(){this.items=[];menu=this}addItem(fn){const i={setTitle(t){this.title=t;return this},setIcon(){return this},setDisabled(v){this.disabled=v;return this},onClick(fn){this.click=fn;return this}};fn(i);this.items.push(i)}showAtMouseEvent(){}showAtPosition(){}}

const notices=[],obsidian={Component,Menu,Modal,setIcon(el){el.innerHTML='<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>'},Notice:class{constructor(message){notices.push(message)}}};

new Function('module','require',await(await fetch('../services/home-covers.js')).text())(dataModule,name=>name==='../ui/header-image'?header.exports:name==='crypto'?{randomUUID:()=>crypto.randomUUID()}:obsidian);
new Function('module','require',await(await fetch('../ui/home-covers.js')).text())(ui,name=>name==='./window-title'?windowTitle.exports:name==='../services/home-covers'?dataModule.exports:name==='./header-image'?header.exports:obsidian);

try{
 service.mount(cover,homeImage,owner,'night',source=>{modal=ui.exports.openHomeCoverEditor(service,source)});

 const headings=[...modal.contentEl.querySelectorAll('.hub-home-cover-heading')];
 for(const h of headings){
  const [label,time,button]=[...h.children].map(el=>el.getBoundingClientRect()),bounds=h.getBoundingClientRect();
  check(Math.abs(label.left-bounds.left)<.1&&Math.abs(button.right-bounds.right)<.1,'Header left/right alignment');
  check(Math.abs(button.left-time.right-8)<.1,'Fixed metadata/menu gap');
  check(Math.abs(button.right-headings[0].lastElementChild.getBoundingClientRect().right)<.1,'Menu column aligned across periods');
  h.lastElementChild.click();check(menu.items.map(i=>i.title).join('|')==='Change image…|Edit image placement…','Header menu reuses preview actions');
 }
 async function verifyGeometry(){
  for(const p of modal.previews){
   const rect=p.frame.getBoundingClientRect(),surface=p.surface.getBoundingClientRect(),scale=rect.width/cover.clientWidth;
   check(Math.abs(rect.height/rect.width-cover.clientHeight/cover.clientWidth)<.001,'Preview exact Home aspect ratio');
   check(Math.abs(surface.width-rect.width)<.1&&Math.abs(surface.height-rect.height)<.1,'Scaled source surface fits preview');
   check(p.surface.clientWidth===cover.clientWidth&&p.surface.clientHeight===cover.clientHeight,'Same full-size layout metrics as Home');
   check(Math.abs(parseFloat(getComputedStyle(p.frame).borderTopLeftRadius)-10*scale)<.01,'Rounded clipping scaled faithfully');
   const reference=document.createElement('div');reference.className='home-cover';reference.style.cssText=`position:absolute;left:-10000px;width:${cover.clientWidth}px`;
   const image=reference.createEl('img',{cls:'home-cover-image'});image.src=p.surface.querySelector('img').src;document.body.append(reference);
   const component=new Component(),editor=header.exports.mountHeaderImage({cover:reference,image,component,...service.placementOptions(p.name)});await editor.prepare();
   const expected=image.getBoundingClientRect(),ref=reference.getBoundingClientRect(),actual=p.surface.querySelector('img').getBoundingClientRect();
   check(Math.abs(actual.width/scale-expected.width)<.15&&Math.abs(actual.height/scale-expected.height)<.15,'Identical image fit/zoom');
   check(Math.abs((actual.left-surface.left)/scale-(expected.left-ref.left))<.15&&Math.abs((actual.top-surface.top)/scale-(expected.top-ref.top))<.15,'Identical crop/position');component.unload();reference.remove();
  }
 }
 await verifyGeometry();
 const p=modal.previews[3],before=JSON.stringify(data.homeCoverImages),homeBefore=cover.querySelector('img').style.cssText;
 p.frame.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true}));check(menu.items.map(i=>i.title).join('|')==='Change image…|Edit image placement…','Preview context menu');menu.items[1].click();await frame();
 p.surface.setPointerCapture=()=>{};p.surface.hasPointerCapture=()=>false;
 function zoom(){const r=p.frame.getBoundingClientRect();p.surface.dispatchEvent(new WheelEvent('wheel',{deltaY:-100,clientX:r.left+r.width/2,clientY:r.top+r.height/2,bubbles:true,cancelable:true}))}
 zoom();await frame();modal.escape();await frame();
 check(!p.editor.editing&&JSON.stringify(data.homeCoverImages)===before&&cover.querySelector('img').style.cssText===homeBefore,'Escape cancels placement only; no saved/live changes');
 p.editor.begin();await frame();zoom();await frame();
 const r=p.frame.getBoundingClientRect();p.surface.dispatchEvent(new PointerEvent('pointerdown',{button:0,pointerId:1,clientX:r.left+80,clientY:r.top+30,bubbles:true,cancelable:true}));p.surface.dispatchEvent(new PointerEvent('pointermove',{pointerId:1,clientX:r.left+110,clientY:r.top+40,bubbles:true}));p.surface.dispatchEvent(new PointerEvent('pointerup',{pointerId:1,bubbles:true}));await frame();
 [...p.frame.querySelectorAll('button')].find(button=>button.textContent==='Done').click();await until(()=>saves===1&&!p.editor.editing&&cover.querySelector('img')!==homeImage);await frame();
 check(data.homeCoverImages.night.placement.zoom>1.9,'Done persists zoom');check(data.homeCoverImages.evening.placement.zoom===1.6,'Shared image Evening unchanged');
 check(JSON.parse(persisted).homeCoverImages.night.placement.zoom===data.homeCoverImages.night.placement.zoom,'Persistence round trip');

 document.querySelector('#home').style.width='750px';await frame();await frame();await verifyGeometry();
 const selectedImage=new File([await(await fetch('../../../../../Assets/Covers/day.jpeg')).arrayBuffer()],'New night.jpg',{type:'image/jpeg'});
 const oldClick=HTMLInputElement.prototype.click;let picker;
 HTMLInputElement.prototype.click=function(){picker=this};
 modal.chooseImage(p);HTMLInputElement.prototype.click=oldClick;
 check(picker?.accept==='image/*','Change image uses existing native file chooser convention');
 Object.defineProperty(picker,'files',{value:[selectedImage]});picker.dispatchEvent(new Event('change'));
 await until(()=>data.homeCoverImages.night.path.startsWith('Assets/Covers/Home/night-')&&p.surface.querySelector('img')?.src.startsWith('blob:')&&cover.querySelector('img')?.src.startsWith('blob:'));
 await frame();await verifyGeometry();
 check(data.homeCoverImages.night.placement===null&&data.homeCoverImages.evening.path==='Assets/Covers/night.jpeg','Image replacement resets only its own placement and retains other periods');
 modal.close();check(!document.querySelector('.hub-home-covers-dialog'),'Modal cleanup');
 modal=ui.exports.openHomeCoverEditor(service,cover);await until(()=>modal.previews.every(p=>p.editor&&!p.surface.querySelector('.hub-home-cover-staging')));await verifyGeometry();

}catch(error){result.textContent='FAIL: '+error.stack}
