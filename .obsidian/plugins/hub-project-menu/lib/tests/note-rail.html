</style><div id="fixtures"></div><pre id="result">RUNNING</pre>

</script><script src="../ui/note-rail.js"></script><script>
const check=(ok,m)=>{if(!ok)throw Error(m)};
const settle=()=>new Promise(resolve=>setTimeout(resolve,240));
(async()=>{try{
 for(const kind of ['Project','Resource']){
  const layout=document.createElement('div');layout.className='layout';layout.innerHTML=`<aside class="sidebar"></aside><main class="workspace-split mod-root hub-project-note-layout"><section class="workspace-tabs hub-project-rail hub-project-rail-pane"><div class="workspace-tab-container"><div class="markdown-preview-view"><div class="markdown-preview-sizer"><div><div class="project-dashboard"><div class="project-nav-dock"><div class="project-nav-identity"><div class="project-nav-title">${kind}</div><div class="project-nav-category">Workspace subtitle</div></div><div class="project-nav"><button class="project-nav-button">Home</button><button class="project-nav-button">Workspace</button><button class="project-nav-button">Last File</button><button class="project-nav-button">Presets</button></div></div><div class="project-main-grid"><div class="project-left-column"><div class="project-folder-stack"><div class="project-folder-panel"><div class="project-folder-header">Folder<input class="project-folder-search"></div><div class="project-browser-columns"><button class="project-browser-column">Name</button><button class="project-browser-column-modified">Modified</button><button class="project-browser-column-created">Created</button></div><div class="project-browser-row"><div class="project-browser-info">Some note</div><div class="project-browser-time">Today</div><div class="project-browser-time">Yesterday</div></div></div></div></div></div></div></div></div></div></div></section><article class="note">Note pane</article></main>`;
  fixtures.append(layout);const pane=layout.querySelector('section'),full=pane.getBoundingClientRect().width;
  const grid=pane.querySelector('.project-main-grid'),folders=pane.querySelector('.project-folder-stack');
  const right=document.createElement('div');right.className='project-right-column';
  right.innerHTML='<div class="project-panel project-tasks"><div class="project-panel-title project-tasks-title">Tasks to Do<button class="project-task-clear-completed">Clear</button></div><div class="project-tasks-body"></div></div><div class="project-panel project-progress">Progress remains hidden in note-view</div>';
  grid.append(right);
  const tasks=right.querySelector('.project-tasks'),taskBody=right.querySelector('.project-tasks-body');
  const fillTasks=()=>{taskBody.innerHTML=Array.from({length:35},(_,i)=>`<div class="project-task-row"><input class="project-task-checkbox" type="checkbox"><div class="project-task-info"><div class="project-task-text">${kind} task ${i}: a long task description that wraps within Half mode</div></div></div>`).join('')};
  fillTasks();
  const extraFolders=document.createElement('div');extraFolders.style.minHeight='1800px';extraFolders.textContent='Long folder structure';folders.append(extraFolders);
  const checkSplit=()=>{
   const g=grid.getBoundingClientRect(),t=tasks.getBoundingClientRect(),f=folders.getBoundingClientRect();
   const gap=parseFloat(getComputedStyle(grid).rowGap),available=g.height-gap;
   check(Math.abs(t.height/available-.3)<.01,'Tasks use 30 percent after the standard panel gap');
   check(Math.abs(f.height/available-.7)<.01,'Folders use 70 percent after the standard panel gap');
   check(Math.abs(t.top-f.bottom-gap)<1&&gap===12,'Standard Workspace spacing separates folders and task panel');
   const style=getComputedStyle(tasks),reference=getComputedStyle(right.querySelector('.project-progress'));
   for(const key of ['backgroundColor','borderTopWidth','borderBottomWidth','borderTopStyle','borderTopColor','borderRadius','padding'])
    check(style[key]===reference[key],'Task panel reuses standard Workspace '+key);

   check(Math.abs(t.bottom-g.bottom)<1,'Tasks remain anchored to content bottom');

   check(tasks.scrollWidth<=tasks.clientWidth+1,'Tasks do not overflow horizontally');
   taskBody.scrollTop=0;folders.scrollTop=60;check(folders.scrollTop>0&&taskBody.scrollTop===0,'Folder scrolling is independent');
   const folderScroll=folders.scrollTop;taskBody.scrollTop=60;check(taskBody.scrollTop>0&&folders.scrollTop===folderScroll,'Task scrolling is independent');
   const nodes=[...taskBody.childNodes];taskBody.textContent='No tasks.';
   check(Math.abs(tasks.getBoundingClientRect().height-t.height)<1,'Empty tasks preserve allocation');
   taskBody.textContent='One task';check(Math.abs(tasks.getBoundingClientRect().height-t.height)<1,'Short task list preserves allocation');
   taskBody.replaceChildren(...nodes);
   extraFolders.hidden=true;check(Math.abs(tasks.getBoundingClientRect().top-t.top)<1,'Short folders preserve task position');extraFolders.hidden=false;
  };
  const control=module.exports.mountNoteRail(pane),button=layout.querySelector('.hub-rail-toggle'),edge=layout.querySelector('.hub-rail-resizer');
  const header=pane.querySelector('.project-nav-dock'),identity=pane.querySelector('.project-nav-identity'),nav=pane.querySelector('.project-nav');
  const checkHeader=()=>{
   check(getComputedStyle(identity).textAlign==='center','Identity is centered');
   const headerRect=header.getBoundingClientRect(),navRect=nav.getBoundingClientRect();
   check(Math.abs((headerRect.left+headerRect.right)-(navRect.left+navRect.right))<1,'Navigation is centered');
   check(getComputedStyle(pane.querySelector('.project-folder-stack')).textAlign!=='center','Folder browser is not centered');
   check(parseFloat(getComputedStyle(pane.querySelector('.project-nav-title')).paddingLeft)===0,'Title has no leading offset');
   check(getComputedStyle(identity).borderBottomWidth==='0px'&&getComputedStyle(header).borderBottomWidth==='0px','No header dividers');
   check(nav.getBoundingClientRect().top>identity.getBoundingClientRect().bottom,'Identity precedes navigation with a spacing gap');
   check(getComputedStyle(nav).display==='grid','Navigation reuses the Workspace grid');
   check(nav.scrollWidth<=nav.clientWidth+1,'Navigation does not overflow');
   check(nav.getBoundingClientRect().top>=button.getBoundingClientRect().bottom,'Navigation clears the rail toggle');
   check([...nav.children].every(el=>getComputedStyle(el).flexGrow==='0'),'Buttons do not stretch');
  };
  checkHeader();checkSplit();
  check(pane.getBoundingClientRect().width===full,'Full preserves original width');
  edge.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));await settle();check(Math.abs(pane.getBoundingClientRect().width-full/2)<1,'Half width');checkHeader();checkSplit();
  for(const el of pane.querySelectorAll('.project-folder-search,.project-browser-time,.project-browser-column-modified,.project-browser-column-created'))check(getComputedStyle(el).display==='none','Half hides search/date columns');
  const row=pane.querySelector('.project-browser-row');check(Math.abs(row.firstElementChild.getBoundingClientRect().width-row.getBoundingClientRect().width)<1,'Name uses whole row, not clipped date layout');
  button.click();await settle();check(pane.getBoundingClientRect().width===0,'Closed width');check(tasks.getBoundingClientRect().height===0,'Closed tasks occupy no layout space');
  check(getComputedStyle(pane.querySelector('.project-dashboard')).visibility==='hidden','Closed content hidden');
  check(getComputedStyle(button).visibility==='visible','Expand remains visible');
  button.click();await settle();check(pane.getBoundingClientRect().width===full/2,'Reopen remembered half');checkSplit();
  check(getComputedStyle(pane.querySelector('.project-folder-search')).display==='none','Remembered half presentation restored');
  // Synthetic events cover state arithmetic; the dedicated physical-input runner covers capture.
  let captured=null;edge.setPointerCapture=id=>captured=id;edge.hasPointerCapture=id=>captured===id;edge.releasePointerCapture=()=>captured=null;
  const pointer=(type,x,id=1)=>edge.dispatchEvent(new PointerEvent(type,{pointerId:id,clientX:x,button:0,bubbles:true}));
  const width=()=>pane.getBoundingClientRect().width;
  const near=(value,message)=>check(Math.abs(width()-value)<1,message+' ('+width()+')');
  const key=key=>edge.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));
  key('End'); near(full,'Keyboard full');
  pointer('pointerdown',full);
  for(const x of [full-20,300,210,180,170]){pointer('pointermove',x);near(x,'Continuous width');}
  check(getComputedStyle(pane).transitionDuration==='0s','No resize lag');
  pointer('pointermove',141);near(170,'Minimum plateau');
  pointer('pointermove',140);near(0,'Collapse threshold');
  pointer('pointermove',159);near(0,'Hysteresis stays closed');
  pointer('pointermove',160);near(170,'Same drag reopens at minimum');
  pointer('pointermove',300);pointer('pointerup',300);near(300,'Custom open width');
  button.click();near(0,'Toggle closes custom width');button.click();near(300,'Toggle restores custom width');
  pointer('pointerdown',300);pointer('pointermove',139);pointer('pointerup',139);near(0,'Drag collapse');
  check(control.getSnapshot().width===300,'Collapse does not erase last rendered open width');
  button.click();near(300,'Toggle after drag collapse restores last open width');
  button.click();
  const b=button.getBoundingClientRect(),h=edge.getBoundingClientRect();
  check(b.width>0&&h.width>0&&b.left>=layout.getBoundingClientRect().left,'Closed controls retain hit areas');
  check(document.elementFromPoint(b.left+b.width/2,b.top+b.height/2)===button||button.contains(document.elementFromPoint(b.left+b.width/2,b.top+b.height/2)),'Closed button hit test');
  pointer('pointerdown',0);pointer('pointermove',159);near(0,'Fresh closed drag threshold');pointer('pointermove',200);pointer('pointerup',200);near(200,'Fresh drag from closed');
  check(edge.getAttribute('aria-valuenow')==='200','Separator reports pixel width');
  pointer('pointerdown',200);pointer('pointermove',190);pointer('pointercancel',190);near(190,'Cancel keeps latest width');check(captured===null,'Cancel releases capture');
  pointer('pointerdown',190);pointer('pointermove',180);window.dispatchEvent(new Event('blur'));near(180,'Blur keeps latest width');check(captured===null,'Blur releases capture');
  pointer('pointerdown',180);pointer('pointermove',190);button.click();near(0,'Toggle interrupts drag');pointer('pointermove',300);near(0,'Interrupted drag cannot reopen');button.click();near(190,'Interrupted drag width remembered');
  key('End');key('ArrowLeft');near(full/2,'Keyboard half');key('ArrowLeft');near(0,'Keyboard closed');key('ArrowRight');near(full/2,'Keyboard reopen half');key('ArrowRight');near(full,'Keyboard full');
  const saved={...control.getSnapshot()}; control.destroy();
  check(!layout.querySelector('.hub-rail-overlay')&&!pane.hasAttribute('data-hub-rail-state')&&!pane.style.getPropertyValue('--hub-rail-custom-width'),'Cleanup removes overlay and width');
  pointer('pointerdown',full);pointer('pointermove',200);
  check(!pane.style.getPropertyValue('--hub-rail-custom-width'),'Destroyed divider listeners cannot resize');
  const reopened=module.exports.mountNoteRail(pane,'closed',()=>{},{width:300});
  near(0,'Closed state remount');layout.querySelector('.hub-rail-toggle').click();near(300,'Remembered width survives remount');reopened.destroy();
  for(const invalid of [NaN,Infinity,-1,0,160,'300']){const test=module.exports.mountNoteRail(pane,'full',()=>{},{width:invalid});near(full,'Invalid width fallback');test.destroy();}
  const test=module.exports.mountNoteRail(pane,'half');near(full/2,'Legacy half fallback');test.destroy();
  check(layout.querySelector('.sidebar').getBoundingClientRect().width===45,'Native sidebar unchanged');
  module.exports.mountNoteRail(pane,kind==='Project'?'full':'half');await settle();
 }
 result.textContent='PASS: Project/Resource Full/Half/Closed, natural single-column rows, hidden search/dates, remembered toggle, continuous drag, keyboard, sidebar width, reentry and cleanup.';
}catch(error){result.textContent='FAIL: '+error.message+'\n'+error.stack}})();
