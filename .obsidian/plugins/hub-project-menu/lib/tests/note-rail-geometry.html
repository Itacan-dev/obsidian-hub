<!doctype html><meta charset="utf-8"><title>Note rail canonical geometry</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../../../../System/Dashboards/Project/view.css">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#1e1e1e;color:#dadada;color-scheme:dark;--size-4-3:12px;--size-4-8:32px;--scrollbar-width:12px;--background-primary:#1e1e1e;--background-secondary:#262626;--background-modifier-border:#363636;--background-modifier-hover:#ffffff08;--text-normal:#dadada;--text-muted:#aaa;--text-faint:#777;--interactive-accent:#8b5cf6;--text-on-accent:white}
button,input{font:inherit;color:inherit}button{cursor:pointer}.workspace{height:calc(100vh - 32px);display:flex}.workspace-split{display:flex;flex:1;min-width:0}.workspace-tabs{min-width:0;overflow:hidden}.document-pane{flex:1;min-width:0;border-left:1px solid #444}.status-bar{height:32px;background:#282828}.workspace-leaf,.workspace-leaf-content{height:100%;min-height:0}.workspace-leaf-content{display:flex;flex-direction:column}.view-header{height:40px;flex:none}.markdown-reading-view{height:100%;display:flex;flex-direction:column}.markdown-preview-view{width:100%;height:100%;padding:40px;overflow:auto;scrollbar-gutter:stable}.markdown-preview-view.is-readable-line-width .markdown-preview-sizer{max-width:700px;margin-inline:auto}
/* Native Obsidian 1.13.7 rules: prepared ItemViews inherit padding that
   Markdown views explicitly remove. Keep these after Hub CSS to test scope. */
.view-content{width:100%;height:calc(100% - 40px)}
.workspace-leaf-content .view-content{padding:var(--size-4-3) var(--size-4-3) var(--size-4-8);overflow:auto}
.workspace-leaf-content[data-type='markdown'] .view-content{padding:0;overflow:hidden}
.workspace-tabs .workspace-leaf .view-content{height:100%}
.dashboard.markdown-preview-view .markdown-preview-sizer{min-height:auto!important;height:auto!important;padding-bottom:60px!important}
#result{white-space:pre-wrap}iframe{border:0;display:block}
</style>
