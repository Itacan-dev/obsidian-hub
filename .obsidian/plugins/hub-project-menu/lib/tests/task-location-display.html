<!doctype html><meta charset="utf-8"><title>Task location polish verification</title>
<link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#131313;color:var(--text-normal);font:14px system-ui;--background-primary:#1e1e1e;--background-secondary:#262626;--background-modifier-border:#373737;--background-modifier-border-focus:#8a5cf5;--background-modifier-hover:#303030;--text-normal:#ddd;--text-muted:#aaa;--text-faint:#888;--interactive-accent:#8a5cf5;--interactive-accent-hover:#9a70ff;--text-on-accent:#fff;--input-shadow:none;--radius-m:8px;--input-radius:6px;--size-4-2:8px;--size-4-4:16px}
