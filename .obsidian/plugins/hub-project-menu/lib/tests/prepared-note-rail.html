<!doctype html><meta charset="utf-8"><title>Atomic prepared rail first paint</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{font:14px Arial;color:#ddd;background:#1e1e1e}.workspace{display:flex;height:600px}.workspace-leaf{width:310px}.project-folder{border:1px solid #444;border-radius:8px;padding:16px;margin:12px}.project-nav{padding:16px}h2{text-align:center}.pdf-pane{padding:20px;border-left:1px solid #444}.view-content{height:100%}</style>
<div class="workspace"></div><pre id="result">RUNNING</pre>
<script type="module">
const check=(v,m)=>{if(!v)throw Error(m)},paint=()=>new Promise(resolve=>requestAnimationFrame(resolve));
HTMLElement.prototype.createEl=function(tag,o={}){const e=document.createElement(tag);e.className=o.cls||'';e.textContent=o.text||'';this.append(e);return e};
HTMLElement.prototype.createDiv=function(o){return this.createEl('div',o)};
class Component{
 constructor(){this.children=[];this.cleanup=[]}
 load(){}
 register(fn){this.cleanup.push(fn)}
 addChild(c){this.children.push(c);return c}
 removeChild(c){c.unload();this.children=this.children.filter(x=>x!==c)}
 unload(){this.children.splice(0).forEach(c=>c.unload());this.cleanup.splice(0).forEach(fn=>fn())}
}
class ItemView extends Component{
 constructor(leaf){super();this.leaf=leaf;this.containerEl=document.createElement('div');this.contentEl=this.containerEl.createDiv({cls:'view-content'})}
 async setState(){}
}
const frames={exports:{}},rails={exports:{}};
const fixtureColors={exports:{}};new Function('module','exports',await(await fetch('../ui/color-system.js')).text())(fixtureColors,fixtureColors.exports);
new Function('module','require',await(await fetch('../ui/dashboard-frame.js')).text())(frames,()=>({refreshHeaderImages(){},ownColorRoot(){return()=>{}}}));
new Function('module','require',await(await fetch('../ui/prepared-note-rail.js')).text())(rails,n=>n==='./color-system'?fixtureColors.exports:({Component,ItemView}));
let factory,renders=0,secondary=0,assetReads=0,activeRail;
const shell=document.querySelector('.workspace');
const code=`
app.countRender();
const frame=app.frame(dv.container,dv.component,"project-dashboard");
frame.root.createEl("h2",{text:dv.name});
frame.root.createDiv({cls:"project-category",text:"Workspace subtitle"});
frame.root.createDiv({cls:"project-nav",text:"Home / Workspace / Last File / Presets"});
frame.root.createDiv({cls:"project-folder",text:"Mathematics"});
frame.root.createDiv({cls:"project-folder",text:"Physics"});
frame.root.createDiv({cls:"project-folder",text:"Concepts"});
frame.root.hubCaptureFolders=()=>({});
frame.defer(()=>app.countSecondary());
frame.commit();
`;
const plugin={registerEvent(){},registerView(type,fn){if(type==='hub-prepared-note-rail')factory=fn},workspaceModes:{
 contextFor:path=>({path,name:path.includes('Knowledge')?'Knowledge':'Obsidian Hub'}),
 pendingNoteRestore:{adopt(){activeRail?.containerEl.classList.add('hub-project-rail')}}
},app:{
 countRender(){renders++},countSecondary(){secondary++},frame:frames.exports.createDashboardFrame,
 vault:{on(){},adapter:{async read(path){assetReads++;return path.endsWith('.js')?code:''}},getAbstractFileByPath:path=>({path})},
 plugins:{getPlugin(){return {localApi(path,component,container){return {component,container,name:path.includes('Knowledge')?'Knowledge':'Obsidian Hub'}}}}}
 }
};
try{
 const controller=rails.exports.createPreparedNoteRails(plugin);
 for(const name of ['Knowledge','Obsidian Hub'])for(const route of ['Last File','Preset'])for(const count of [1,3]){
  shell.textContent='Current Home / Workspace';const prior=shell.textContent;
  const context={path:name+'/Hub.md',name};
  const leaves=Array.from({length:count},(_,i)=>({type:'leaf',id:'file'+i,state:{type:i?'markdown':'pdf',state:{file:'Note'+i}}}));
  const snapshot={main:{type:'split',children:[{type:'leaf',id:'hub',state:{type:'markdown',state:{file:context.path}}},...leaves]},active:'file0'};
  const before=renders,prepared=await controller.prepare(context,snapshot,document);
  check(shell.textContent===prior,'Current page stays mounted during preparation');
  check(renders===before+1,'One structural render, not two');
  check(JSON.stringify(prepared.snapshot.main.children.slice(1))===JSON.stringify(leaves),'Other native panes unchanged');
  check(prepared.snapshot.active==='file0','Active tab preserved');
  const root=document.createElement('div');root.className='workspace-leaf';
  activeRail=factory({id:'hub',containerEl:root});
  root.append(activeRail.containerEl);
  check(root.querySelector('.project-nav')&&root.querySelectorAll('.project-folder').length===3,'Native view constructor already contains complete structural rail');
  // Native attaches the custom host and assigns state in the same task. The
  // other pane intentionally remains loading across subsequent browser frames.
  shell.replaceChildren(root);
  await paint();
  check(root.querySelector('.project-nav')&&root.querySelectorAll('.project-folder').length===3,'No blank first paint even when native setState is deferred');
  const pdf=shell.createDiv({cls:'pdf-pane',text:'PDF / note content still loading independently'});
  const state=prepared.snapshot.main.children[0].state.state;
  const setting=activeRail.setState(state,{});
  check(root.querySelector('.project-nav')&&root.querySelectorAll('.project-folder').length===3,'Correct structure committed synchronously in native setState');
  for(let n=0;n<3;n++){
   await paint();
   check(root.querySelector('h2').textContent===name&&root.querySelector('.project-nav')&&root.querySelectorAll('.project-folder').length===3,route+': no title-only first or subsequent painted frame');
   check(renders===before+1,'No later replacement renderer');
  }
  await setting;prepared.dispose();activeRail.unload();
 }
 check(assetReads===2,'Renderer source/CSS cached between restores');
 const unused=await controller.prepare({path:'Knowledge/Hub.md',name:'Knowledge'},{main:{type:'leaf',state:{state:{file:'Knowledge/Hub.md'}}}},document);
 unused.dispose();controller.destroy();
 result.textContent='PASS: actual prepared-rail host + frame lifecycle; structural DOM present before first paint; Home/Workspace Last File/Preset contracts; Project/Resource; single/multiple native panes; PDF loading remains independent; one render, cached assets, saved layout isolation and cleanup. Native Obsidian integration still requires live validation.';
}catch(e){result.textContent='FAIL '+e.stack}
</script>
