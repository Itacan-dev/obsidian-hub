<body class="theme-dark hub-button-scope"><main id="fixture"></main><pre id="result">RUNNING</pre>
<script type="module">

try{
 if(new URLSearchParams(location.search).get('home-source')==='light')document.body.classList.replace('theme-dark','theme-light');

 const source=await(await fetch('task-editor-step-context.html')).text(),setup=source.slice(source.indexOf(' const source=await'),source.indexOf(' // A genuine shared-renderer panel')).replace('["ui/task-editor", "ui/task-card", "ui/text-field-focus"]','["ui/task-editor", "ui/task-card", "ui/text-field-focus", "ui/tasks"]');
 const {load,obsidian,owner}=await new (Object.getPrototypeOf(async function(){}).constructor)(setup+';return {load,obsidian,owner};')();obsidian.Component.prototype.addChild=function(child){this.children.add(child);return child};
 // Use the unmodified Files explorer selectors and native SVG class as the

 folder.createSpan({text:'Folder reference'});

 const sample=(row,toggle)=>{const cb=row.querySelector('input[type=checkbox]').getBoundingClientRect(),host=toggle.parentElement,list=host.querySelector('.hub-task-step-items'),g=getComputedStyle(list,'::before'),b=list.getBoundingClientRect(),s=toggle.querySelector('svg').getBoundingClientRect(),c=toggle.querySelector('.hub-task-steps-chevron').getBoundingClientRect(),label=toggle.querySelector('.hub-task-steps-label').getBoundingClientRect();return{axis:cb.x+cb.width/2,guide:b.x+parseFloat(g.left)+parseFloat(g.width)/2,guideStyle:[g.left,g.top,g.bottom,g.width,g.backgroundColor],chevron:getComputedStyle(toggle.querySelector('.hub-task-steps-chevron')).color,svg:{w:s.width,h:s.height,stroke:getComputedStyle(toggle.querySelector('svg')).strokeWidth},center:c.x+c.width/2,gap:label.x-c.right,headingHeight:toggle.getBoundingClientRect().height}};
 async function verify(row,toggle,completed,total,name){

  if(toggle.getAttribute('aria-expanded')!=='true')toggle.click();await frame();
  const label=toggle.querySelector('.hub-task-steps-label'),progress=toggle.querySelector('.hub-task-step-progress'),initial=sample(row,toggle);

  toggle.click();await frame();referenceIcon('chevron-right');const collapsed=sample(row,toggle);check(collapsed.chevron===referenceStyle().color&&collapsed.svg.stroke===referenceStyle().stroke&&collapsed.svg.w===initial.svg.w&&collapsed.svg.h===initial.svg.h,name+' collapsed Files explorer styling');check(toggle.getAttribute('aria-label')==='Expand '+phrase(completed,total),name+' collapsed accessible wording');toggle.click();referenceIcon('chevron-down');

 }
 const fixture=document.querySelector('#fixture');
 for(const context of ['Home','Project','Resource'])for(const width of [480,190]){
  const shell=fixture.createDiv({cls:'heading-panel '+(context==='Home'?'home-dashboard':'project-dashboard')});shell.style.width=width+'px';const body=shell.createDiv({cls:context==='Home'?'home-tasks-body':'project-tasks-body'}),component=new obsidian.Component();component.load();
  const nativeOwner=context==='Resource'?{type:'resource',id:'references'}:owner;
  const ui=load('ui/tasks').createTaskUi({app:{},component,body});
  for(const [total,completed]of [[0,0],[1,0],[1,1],[2,0],[2,1],[2,2],[5,3],[100,99]]){
   const task={id:'task-'+total+'-'+completed,text:'Assignment 2',nativeReference:{authorityId:'fixture',owner:nativeOwner,taskId:'task-'+total+'-'+completed},nativeLocationDisplay:{workspaceName:'Fixture',segments:['Topology.md'],available:true},steps:Array.from({length:total},(_,i)=>({id:'step-'+i,text:'Task '+(i+1),completed:i<completed}))},parts=load('ui/task-card').createTaskRow(body,task,false,{variant:context==='Home'?'home':'project'});

 }
 for(const mode of ['Add','Edit']){

   await openEditor(mode,total);const f=editor.taskFields;f.state.steps.forEach((step,i)=>step.completed=i<completed);f.steps.list.querySelectorAll('input[type=checkbox]').forEach((checkbox,i)=>{checkbox.checked=i<completed;checkbox.parentElement.classList.toggle('is-completed',checkbox.checked)});f.refresh();
