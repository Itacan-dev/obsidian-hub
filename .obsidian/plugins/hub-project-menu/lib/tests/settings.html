<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../../../../System/Dashboards/Home/view.css">
<style>
body{margin:0;background:#1e1e1e;color:#ddd;font:16px Arial;--text-normal:#ddd;--text-muted:#aaa;--text-faint:#777;--background-primary:#1e1e1e;--background-secondary:#262626;--background-modifier-border:#444;--background-modifier-hover:#333;--interactive-accent:#8955ed;--text-on-accent:#fff;--color-green:#62b478;--input-shadow:none}

<script type="module">
HTMLElement.prototype.createEl=function(tag,o={}){const e=document.createElement(tag);e.className=o.cls||'';e.textContent=o.text||'';for(const[k,v]of Object.entries(o.attr||{}))e.setAttribute(k,v);this.append(e);return e};
HTMLElement.prototype.createDiv=function(o){return this.createEl('div',o)};HTMLElement.prototype.createSpan=function(o){return this.createEl('span',o)};HTMLElement.prototype.empty=function(){this.replaceChildren()};
class Component{constructor(){this.children=new Set();this.cleanups=[]}load(){}register(fn){this.cleanups.push(fn)}addChild(c){this.children.add(c)}removeChild(c){c.unload();this.children.delete(c)}unload(){this.children.forEach(c=>c.unload());this.cleanups.forEach(fn=>fn())}}
class Modal{constructor(app){this.app=app;this.containerEl=document.body.createDiv({cls:'modal-container'});this.modalEl=this.containerEl.createDiv({cls:'modal'});this.contentEl=this.modalEl.createDiv();this.modalEl.createEl('button',{cls:'modal-close-button',text:'×'}).onclick=()=>this.close()}open(){this.onOpen()}close(){this.onClose();this.containerEl.remove()}}
const icons={'square-check':'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/>','circle-check':'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>','chevron-right':'<path d="m9 5 7 7-7 7"/>','file-text':'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z M14 2v6h6 M8 13h8 M8 17h8"/>'};
icons.shield='<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11"/>';icons.newspaper='<path d="M4 22h16a2 2 0 0 0 2-2V2H6v18a2 2 0 0 1-4 0V8h4 M10 6h8 M10 10h8 M10 14h3 M16 14h2 M10 18h3 M16 18h2"/>';
const native={Modal,Component,setIcon:(el,name)=>{el.dataset.icon=name;el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">'+(icons[name]||'')+'</svg>'},MarkdownRenderer:{render:async(app,text,el)=>{el.textContent=text}}};
const names=['ui/settings','ui/settings-pages','ui/tooltips','atlas/obsidian/ui'],sources={},cache={};
for(const name of names)sources[name]=await(await fetch('../'+name+'.js')).text();
function load(name){if(name==='obsidian')return native;if(cache[name])return cache[name].exports;const m=cache[name]={exports:{}};new Function('module','require',sources[name])(m,n=>{if(n==='obsidian')return native;const path=(name.slice(0,name.lastIndexOf('/'))+'/'+n).split('/'),out=[];for(const p of path){if(p==='..')out.pop();else if(p!=='.')out.push(p)}return load(out.join('/'))});return m.exports}
const assert=(v,m)=>{if(!v)throw Error(m)},settle=async()=>{for(let i=0;i<20;i++)await Promise.resolve()};
try {
 const {mountSettingsControl}=load('ui/settings'),{SETTINGS_PAGES}=load('ui/settings-pages');
 const appRoot=document.body.createDiv({cls:'app-container'}),view=appRoot.createDiv({cls:'workspace',text:'Home'}),bar=appRoot.createDiv({cls:'status-bar hub-oath-statusbar'});
 const host=bar.createDiv({cls:'status-bar-item hub-oath-control hub-button-scope'});
 for(const [name,icon]of [['The Oath','shield'],['Daily brief','newspaper']]){const b=host.createEl('button',{cls:'hub-oath-button'+(icon==='newspaper'?' hub-daily-brief-button':'')});native.setIcon(b.createSpan({cls:'hub-oath-icon'}),icon);b.createSpan({text:name})}
 const status=bar.createSpan({cls:'status-bar-item',text:'2 backlinks | 180 words'}),beforeHeight=bar.offsetHeight,beforeRight=status.getBoundingClientRect().right;
 const state={view:'home',lastFile:'P/Assignment.md',preset:'Study',oath:'active'},initial=JSON.stringify(state),classes=document.body.className,style=document.documentElement.getAttribute('style');
 const plugin={app:{},registerDomEvent:(el,name,fn)=>el.addEventListener(name,fn)};
 for(const key of ['dataStore','projectWizard','workspaceModes','oath'])Object.defineProperty(plugin,key,{get(){throw Error('Settings accessed '+key)}});
 const control=mountSettingsControl(plugin,host),button=control.button;
 assert(button.previousElementSibling.classList.contains('hub-daily-brief-button'),'Shared footer position');
 assert(button.querySelector('[data-icon=settings]'),'Lucide Settings');
 assert(button.offsetHeight===host.firstElementChild.offsetHeight&&getComputedStyle(button).fontSize===getComputedStyle(host.firstElementChild).fontSize,'Identical shell sizing');
 assert(button.getBoundingClientRect().top===host.firstElementChild.getBoundingClientRect().top,'Shell vertical alignment');
 const controls=[...host.children],rects=controls.map(el=>el.getBoundingClientRect());
 const gaps=rects.slice(1).map((rect,i)=>rect.left-rects[i].right);
 assert(gaps.every(gap=>Math.abs(gap-10)<0.1),'Equal 10px shell control box gaps');
 const visibleGaps=controls.slice(1).map((el,i)=>el.firstElementChild.getBoundingClientRect().left-controls[i].lastElementChild.getBoundingClientRect().right);
 assert(visibleGaps.every(gap=>Math.abs(gap-15)<0.1),'Equal 15px padded-label-to-next-icon spacing (16px from text)');
 assert(rects.every(rect=>rect.height===28&&rect.width>=44),'Comfortable shell hit targets');
 for(const el of controls){
  const icon=el.firstElementChild,label=el.lastElementChild,svg=icon.querySelector('svg'),css=getComputedStyle(el);
  assert(Math.abs(label.getBoundingClientRect().left-icon.getBoundingClientRect().right-4)<0.1,'Consistent 4px icon-to-label gap');
  assert(svg.getBoundingClientRect().width===17&&svg.getBoundingClientRect().height===17,'Identical icon sizes');
  assert(label.getBoundingClientRect().top===controls[0].lastElementChild.getBoundingClientRect().top,'Aligned labels');
  assert(css.fontSize===getComputedStyle(controls[0]).fontSize&&css.fontWeight===getComputedStyle(controls[0]).fontWeight,'Identical text size and weight');
 }
 assert(parseFloat(getComputedStyle(button).marginInlineStart)===0,'No extra Settings margin');
 assert(bar.offsetHeight===beforeHeight&&Math.abs(status.getBoundingClientRect().right-beforeRight)<1,'Footer height and right status stay fixed');
 for(const mode of ['home','project-full','project-note']){
  view.textContent=mode;button.click();await settle();const dialog=document.querySelector('.hub-settings-dialog');assert(dialog,'Opens Settings from '+mode);
  const tabs=[...dialog.querySelectorAll('[role=tab]')],panel=dialog.querySelector('[role=tabpanel]'),sidebar=dialog.querySelector('.hub-settings-sidebar');
  assert(dialog.querySelector('header h2').textContent==='Settings'&&!dialog.querySelector('header svg'),'Plain native modal title');
  assert(tabs.map(x=>x.textContent).join('|')===SETTINGS_PAGES.map(x=>x.title).join('|'),'Complete ordered category list');
  assert(tabs[1].getAttribute('aria-selected')==='true'&&panel.querySelector('h2').textContent==='Appearance','Appearance initial page');
  assert(panel.querySelector('.hub-settings-section h3').textContent==='Theme','Theme pack first');
  const originals=[...panel.querySelectorAll('select,button')].map(x=>x.outerHTML).join('');
  for(const input of panel.querySelectorAll('select,button')){assert(input.disabled,'All preview controls visibly disabled');input.click()}
  assert([...panel.querySelectorAll('select,button')].map(x=>x.outerHTML).join('')===originals,'Preview clicks do not change local selection');
  assert(panel.querySelector('[role=switch]').getAttribute('aria-disabled')==='true','Toggle is a disabled preview');
  const y=sidebar.getBoundingClientRect().top;panel.scrollTop=200;assert(panel.scrollTop>0&&sidebar.getBoundingClientRect().top===y,'Independent content scrolling');
  const search=dialog.querySelector('input[type=search]');search.value='font';search.dispatchEvent(new Event('input',{bubbles:true}));assert(tabs.length===14&&tabs.every(x=>x.getClientRects().length),'Search does not filter');
  assert(!tabs.some(tab=>tab.textContent.includes('Daily brief')),'Developer Daily brief is absent from shipped Settings');
  for(let i=0;i<tabs.length;i++){tabs[i].click();assert(panel.querySelector('h2').textContent===SETTINGS_PAGES[i].title,'Navigable category '+i);assert(panel.scrollTop===0,'Page scroll resets');if(i!==1)assert(!panel.querySelector('input,button,select')&&panel.querySelectorAll('.hub-settings-empty-section').length===2,'Sparse intentional shell')}
  tabs[0].focus();tabs[0].dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));assert(document.activeElement===tabs[1]&&tabs[1].getAttribute('aria-selected')==='true','Keyboard categories');
  control.open();assert(document.querySelectorAll('.hub-settings-dialog').length===1,'One Settings window');
  assert(document.body.className===classes&&document.documentElement.getAttribute('style')===style&&JSON.stringify(state)===initial,'No theme or application state changes');
  dialog.querySelector('.modal-close-button').click();assert(!document.querySelector('.hub-settings-dialog')&&view.textContent===mode&&document.activeElement===button,'Close restores shell focus and underlying view');
 }
 button.click();await settle();const dialog=document.querySelector('.hub-settings-dialog'),panel=dialog.querySelector('.hub-settings-panel');
 for(const width of [600,380,304]){dialog.style.width=width+'px';await settle();assert(panel.scrollWidth<=panel.clientWidth+1,'No narrow content overlap at '+width);assert(dialog.scrollWidth<=dialog.clientWidth+1,'Modal fits at '+width)}dialog.style.width='';
 const before=dialog.querySelector('.hub-settings-sidebar').getBoundingClientRect().top;panel.scrollTop=100;assert(dialog.querySelector('.hub-settings-sidebar').getBoundingClientRect().top===before,'Fixed navigation');panel.scrollTop=0;
 const listeners=new Set();let subscriptions=0,disposals=0,commands=0;
 plugin.atlas={view:()=>({status:'UNAVAILABLE',reason:'TEST_UNAVAILABLE',snapshot:null,contexts:[]}),
  subscribe:fn=>{listeners.add(fn);subscriptions++;return()=>{assert(listeners.delete(fn),'Dispose each Atlas subscription once');disposals++}},
  command:async()=>{commands++;return {type:'BLOCKED',reason:'TEST_UNAVAILABLE'}}};
 const atlasTab=[...dialog.querySelectorAll('[role=tab]')].find(tab=>tab.textContent==='Atlas');
 const appearanceTab=[...dialog.querySelectorAll('[role=tab]')].find(tab=>tab.textContent==='Appearance');
 atlasTab.click();assert(panel.classList.contains('hub-atlas-overview')&&panel.textContent.includes('Atlas: unavailable'),'Atlas receives the live plugin bridge');
 assert(listeners.size===1,'One live Atlas page subscription');
 const recover=[...panel.querySelectorAll('button')].find(button=>button.textContent==='Recover saved state');recover.click();await settle();
 assert(commands===1,'Atlas settings actions reach the bridge');
 appearanceTab.click();assert(listeners.size===0&&!panel.classList.contains('hub-atlas-overview'),'Leaving Atlas disposes its subscription and scoped styling');
 assert(panel.querySelector('.hub-settings-section h3').textContent==='Theme','Newer Appearance page survives Atlas navigation');
 atlasTab.click();assert(listeners.size===1,'Atlas can be reopened without duplicate subscriptions');
 dialog.querySelector('.modal-close-button').click();assert(listeners.size===0&&subscriptions===disposals,'Closing Settings cleans up Atlas');
 assert(JSON.stringify(state)===initial,'Atlas settings leave workspace, presets and Oath state intact');
 button.click();await settle();
 result.textContent='PASS: shared footer, all 14 shipped categories, developer-only Daily brief hidden, keyboard navigation, initial Appearance, inert controls/search, zero store/navigation access, stable underlying views, independent scrolling, narrow layouts and Atlas bridge/subscription/style cleanup.';
 // Leave the preview visible for the rendered inspection.
}catch(e){result.textContent='FAIL: '+e.stack}
</script>
