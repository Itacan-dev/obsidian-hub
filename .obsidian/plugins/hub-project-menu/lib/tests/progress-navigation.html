<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../../../heatmap-calendar/styles.css"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../../../../System/Dashboards/Home/view.css"><link rel="stylesheet" href="../../../../../System/Dashboards/Project/view.css">
<style>body{background:#262626;color:#ddd;font:13px Arial;--text-muted:#999;--background-modifier-hover:#333}.panel{width:470px;margin:20px}.heatmap-calendar-graph{display:grid}.heatmap-calendar-months{list-style:none;padding:0}.heatmap-calendar-boxes{height:65px;background:#18212b}</style><div id="fixtures" class="hub-button-scope"></div><pre id="result">RUNNING</pre>
<script type="module">
const check=(v,m)=>{if(!v)throw Error(m)};
HTMLElement.prototype.createEl=function(t,o={}){const e=document.createElement(t);e.className=o.cls||'';e.textContent=o.text||'';this.append(e);return e};
let latest;class Menu{constructor(){latest=this;this.items=[]}addItem(f){const i={setTitle(t){this.title=t;return this},setIcon(v){this.icon=v;return this},setChecked(v){this.checked=v;return this},onClick(f){this.click=f;return this}};f(i);this.items.push(i)}onHide(f){this.onhide=f}showAtPosition(){}hide(){this.onhide()}}
HTMLElement.prototype.createDiv=function(o){return this.createEl('div',o)};
document.body.style.setProperty('--interactive-accent','#8955ed');
const native={Menu,setIcon(e,name){e.dataset.icon=name;e.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor"/></svg>'}};
const tooltip={exports:{}},module={exports:{}};
new Function('module',await(await fetch('../ui/tooltips.js')).text())(tooltip);
const colors={exports:{}};
new Function('module',await(await fetch('../ui/progress-colors.js')).text())(colors);
new Function('module','require',await(await fetch('../ui/dashboard-ui.js')).text())(module,n=>n==='obsidian'?native:n==='./progress-colors'?colors.exports:tooltip.exports);
const ui=module.exports.createDashboardUi({navClass:'home-nav-button'});
try{
check(ui.progressColors.green.join('|')===[.25,.5,.75,1].map(a=>`rgba(13, 201, 79, ${a})`).join('|'),'Exact original Home base palette');
for(let score=1;score<=4;score+=.05){
 const alpha=Math.max(1,Math.floor(score*4)/4)/4;
 check(ui.progressColor(score)===`rgba(13, 201, 79, ${alpha})`,'Original Home quarter-point color mapping unchanged');
}
for(const file of ['Home','Project']){
 const source=await(await fetch(`../../../../../System/Dashboards/${file}/view.js`)).text();
 check(source.includes('progressColors,')&&/backgroundColor\s*=\s*progressColor\(/.test(source),'Both renderers use shared palette and per-score mapping');
 check(!source.includes('#35C96F')&&!source.includes('#0dc94f'),'No duplicated view-specific green definitions');
}
for(const kind of ['Home Projects','Home Resources','Project','Resource']){
 const colorFixture=fixtures.createEl('div',{cls:kind.startsWith('Home')?'home-progress-calendar':'project-progress-calendar'});
 for(const score of [1,2,3,4]){
  const cell=colorFixture.createEl('button',{cls:'hub-progress-day'});
  cell.style.backgroundColor=ui.progressColor(score);
  check(getComputedStyle(cell).backgroundColor===(score===4?'rgb(13, 201, 79)':`rgba(13, 201, 79, ${score/4})`),'Same rendered intensity in '+kind);
  cell.focus();check(getComputedStyle(cell).boxShadow.includes('inset'),'Shared focus treatment in '+kind);cell.blur();
 }
 colorFixture.remove();
 const panel=fixtures.createEl('div',{cls:'panel'}),heading=panel.createEl('div',{cls:'home-panel-title',text:'Progress'});
 if(kind.startsWith('Home')){
  const home=await(await fetch('../../../../../System/Dashboards/Home/view.js')).text();
  const controls=home.slice(home.indexOf('const progressHeaderControls ='),home.indexOf('const progressToolbar ='));
  const switcher=home.slice(home.indexOf('function setProgressScope('),home.indexOf('reportsTab.addEventListener('));
  const years=home.slice(home.indexOf('function refreshProgressYears()'),home.indexOf('const progressSection ='));
  const make=new Function('progressHeader','initialScope',`
   let progressScope=initialScope,progressYear=2023,progressYears=[],workRatings={},progressReports,recentScrollTarget=0,refreshes=0;
   const currentProgressYear=2026,PROGRESS_SCOPE_STORAGE_KEY='hub-test-scope',recentBody={scrollTop:0};
   function refreshWorkProgress(){refreshes++;workRatings=progressScope==='projects'?{'2023-01-01':2}:{}}
   const getScopedProgressReports=()=>[],renderProgressYear=()=>{},renderActiveProgressView=()=>{};
   ${years}\n${controls}\n${switcher}
   refreshWorkProgress();refreshProgressYears();
   return {get scope(){return progressScope},get year(){return progressYear},get years(){return progressYears},get refreshes(){return refreshes}};
  `);
  const state=make(heading,kind.endsWith('Resources')?'resources':'projects');
  const buttons=[...heading.querySelectorAll('.home-progress-scope-controls button')];
  check(buttons.map(b=>b.textContent).join(',')==='Projects,Resources','Both choices always visible without icons');
  check(!heading.querySelector('svg,[aria-haspopup],.hub-disclosure'),'No scope disclosure or icons');
  check(Math.abs(buttons[1].getBoundingClientRect().width-buttons[0].getBoundingClientRect().width)<1,'Scope buttons retain the current equal-width convention');
  const tabs=panel.createEl('div',{cls:'home-progress-tabs hub-panel-selectors'}),reference=tabs.createEl('button',{text:'Reports'});
  for(const property of ['fontSize','padding','height','borderRadius','borderColor','backgroundColor','transition']) {
   const inactive=buttons.find(b=>!b.classList.contains('is-active'));
   check(getComputedStyle(inactive)[property]===getComputedStyle(reference)[property],`Scope reuses history selector ${property}`);
  }
  tabs.remove();
  const headerBox=heading.getBoundingClientRect();
  check(buttons[1].getBoundingClientRect().right<=headerBox.right,'Selectors fit existing 470px panel width');
  for(const scope of ['resources','projects','resources','projects']) {
   buttons.find(b=>b.dataset.scope===scope).click();
   check(state.scope===scope&&state.year===2023&&state.years.includes(2023)&&state.years.includes(2024),'Switch preserves selected past year and next-year navigation even without scoped data');
   check(buttons.filter(b=>b.classList.contains('is-active')).length===1,'Exactly one selected purple view');
   await Promise.all(buttons.flatMap(b=>b.getAnimations()).map(a=>a.finished));
   check(getComputedStyle(buttons.find(b=>b.dataset.scope===scope)).backgroundColor==='rgb(137, 85, 237)','Selected button uses existing purple accent');
   check(buttons.every(b=>b.getAttribute('aria-pressed')===String(b.dataset.scope===scope)),'Accessible selected state');
   const before=state.refreshes;buttons.find(b=>b.dataset.scope===scope).click();check(state.refreshes===before,'Active click does not recompute progress');
  }
  check(!home.includes('showChoiceMenu')&&!home.includes('progressScopeMenu'),'Old Home dropdown behavior removed');
 }else check(!heading.querySelector('button'),'Workspace panels have no scope controls');
 const calendar=panel.createEl('div',{cls:kind.startsWith('Home')?'home-progress-calendar':'project-progress-calendar'}),toolbar=document.createElement('div'),prev=toolbar.createEl('button'),year=toolbar.createEl('span'),next=toolbar.createEl('button');native.setIcon(prev,'chevron-left');native.setIcon(next,'chevron-right');let clicks=0;prev.onclick=()=>clicks++;
 for(const y of [2026,2025,2026]){
 calendar.innerHTML='<div class="heatmap-calendar-graph"><ol class="heatmap-calendar-months">'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,i)=>`<li style="grid-column:${3+i*4} / span 4">${m}</li>`).join('')+'</ol><div class="heatmap-calendar-boxes"></div></div>';
 const cells=calendar.querySelector('.heatmap-calendar-boxes');year.textContent=String(y);next.disabled=y===2026;
 const months=calendar.querySelector('.heatmap-calendar-months');
 const geometry=()=>JSON.stringify([calendar,cells,months,...months.children].map(e=>e.getBoundingClientRect().toJSON()));
 const before=geometry();
 ui.placeHeatmapNavigation(calendar,toolbar,prev,year,next);
 check(year.textContent===String(y).slice(-2)&&year.getAttribute('aria-label')===String(y),'Compact year retains accessible full year');
 check(getComputedStyle(next).visibility===(y===2026?'hidden':'visible'),'Next year absent only at latest year');
 check(months.parentElement===toolbar.parentElement&&calendar.querySelector('.heatmap-calendar-boxes')===cells,'Native month grid retained separately from controls');prev.click();
 check(geometry()===before,'Every month label, heatmap and panel bound exactly unchanged');
 const area=toolbar.getBoundingClientRect(),yearRect=year.getBoundingClientRect(),box=cells.getBoundingClientRect();
 const jan=months.firstElementChild.getBoundingClientRect();
 check(Math.abs(yearRect.left-calendar.getBoundingClientRect().left)<.1&&Math.abs(yearRect.top-jan.top-1)<.1&&Math.abs(yearRect.height-jan.height)<.1,'Year retains gutter position with one-pixel optical lowering');
 check(yearRect.right<=jan.left,'Year does not overlap January');
 for(const [arrow,edge] of [[prev,box.left],[next,box.right]]){const r=arrow.getBoundingClientRect();check(Math.abs(r.left+r.width/2-edge)<.1&&Math.abs(r.top+r.height/2-box.top-box.height/2)<.1,'Overlay chevron centered on cell grid edge');check(r.width===28&&r.height===28,'Unchanged usable hit target');check(getComputedStyle(arrow).borderRadius==='4px','Rounded-square treatment');}
 const move=(target,x)=>target.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerType:'mouse',clientX:x,clientY:box.top+box.height/2}));
 move(cells,box.left+31);check(prev.classList.contains('is-near')&&!next.classList.contains('is-near'),'Left edge reveals only left control');
 move(prev,box.left-10);check(prev.classList.contains('is-near'),'Moving onto protruding button retains reveal');
 move(cells,box.right-31);check(next.classList.contains('is-near')===!next.disabled&&!prev.classList.contains('is-near'),'Right edge respects available years');
 move(cells,box.left+box.width/2);check(!prev.classList.contains('is-near')&&!next.classList.contains('is-near'),'Center hides both controls');
 move(cells,box.left+20);months.parentElement.dispatchEvent(new PointerEvent('pointerleave'));check(!prev.classList.contains('is-near'),'Leaving graph clears reveal');
 check(geometry()===before,'Proximity reveal preserves all geometry');
 prev.disabled=true;check(getComputedStyle(prev).visibility==='hidden','Previous hidden when unavailable');prev.disabled=false;
 }
 check(clicks===3,'Handlers survive repeated render');check(heading.querySelectorAll('.hub-heatmap-navigation').length===0,'Year controls absent from heading');
}
result.textContent='PASS: Home Projects/Resources, Project/Resource year rows, repeated renders, current/past years, next visibility, scope checks and callbacks.';
}catch(e){result.textContent='FAIL: '+e.stack}
</script>
