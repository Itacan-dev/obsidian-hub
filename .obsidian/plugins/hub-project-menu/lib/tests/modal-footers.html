<!doctype html><meta charset="utf-8"><title>Modal footer consistency</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" data-dashboard="home" href="../../../../../System/Dashboards/Home/view.css"><link rel="stylesheet" data-dashboard="project" href="../../../../../System/Dashboards/Project/view.css">
<style>
body{margin:0;font:14px Arial;color:#ddd;background:#222;--background-primary:#222;--background-secondary:#292929;--background-modifier-border:#555;--text-normal:#ddd;--text-muted:#aaa;--interactive-accent:#8955ed;--text-on-accent:#fff;--input-shadow:none}
*{box-sizing:border-box}button,input,select,textarea{font:inherit;color:inherit;background:#333}button{height:32px;padding:4px 12px}button.mod-cta{background:var(--interactive-accent)}.modal{margin:20px auto;padding:24px;background:#292929;display:flex;flex-direction:column;max-height:calc(100vh - 40px);overflow:hidden}.modal-content{min-height:0;overflow:auto}#families{padding:10px}#result{position:fixed;bottom:0;background:#222;font-size:10px;white-space:normal;z-index:20;pointer-events:none}
</style><main id="families" class="hub-button-scope"></main><pre id="result">RUNNING</pre>
<script type="module">
// HUB_TEST_PREVIEW selects plugin-only, home (default), project, or both.
const cssMode=new URLSearchParams(location.search).get('preview')||'home';
for(const sheet of document.querySelectorAll('link[data-dashboard]'))if(cssMode==='plugin-only'||['home','project'].includes(cssMode)&&sheet.dataset.dashboard!==cssMode)sheet.remove();
let checks=0;const check=(v,m)=>{checks++;if(!v)throw Error(m)},settle=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
try{
 const families=document.getElementById('families');
 for(const family of ['hub-capture-actions','hub-task-dialog-actions','hub-oath-actions','hub-project-advancement-actions','hub-project-wizard-actions']){
  const footer=document.createElement('div');footer.className=family;families.append(footer);
  for(const text of ['Cancel','Primary']){const button=document.createElement('button');button.textContent=text;if(text==='Primary')button.className='mod-cta';footer.append(button)}
  const capture=family==='hub-capture-actions',narrow=innerWidth<=680;
  const style=getComputedStyle(footer);check(style.gap===(capture&&narrow?'6px':'8px'),family+' correct normal/narrow gap');
  for(const button of footer.children){const s=getComputedStyle(button);check(s.minHeight==='36px'&&button.getBoundingClientRect().height===36,family+' 36px ordinary action');check(s.paddingLeft===(capture&&narrow?'10px':'16px')&&s.paddingRight===s.paddingLeft,family+' consistent padding with narrow Capture exception');}
  const primary=getComputedStyle(footer.lastElementChild);check(primary.borderTopWidth==='0px'&&primary.backgroundColor===(family==='hub-oath-actions'?'rgb(113, 80, 204)':'rgb(137, 85, 237)'),family+' borderless purple primary preserves existing color');
 }
 const compact=document.createElement('div');compact.className='hub-inbox-detail-actions';compact.innerHTML='<button>Make task</button>';families.append(compact);check(getComputedStyle(compact.firstElementChild).minHeight==='30px','Compact Inbox action remains exempt');
 families.replaceChildren();
 const module = { exports: {} };
 const source = await (await fetch('../ui/window-title.js')).text();
 new Function('module', 'require', source)(module, () => ({ setIcon() {} }));
 const { layoutModal, mountModalSeparators } = module.exports;
 const near = (a, b) => Math.abs(a-b) < .1;
 const bounds = el => el.getBoundingClientRect();
 const make = (host, tag, className, text) => {
  const el = document.createElement(tag);
  el.className = className;
  if (text) el.textContent = text;
  host.append(el);
  return el;
 };
 for (const theme of ['dark','light']) {
  document.body.className = 'theme-' + theme;
  const color = theme === 'dark' ? '#555' : '#ccc';
  document.body.style.setProperty('--background-modifier-border', color);
  const expectedColor = theme === 'dark' ? 'rgb(85, 85, 85)' : 'rgb(204, 204, 204)';
  for (const [name, modalClass, headerClass, footerClass, labels, mode] of [
   ['Quick Add','hub-quick-add-dialog','hub-capture-header','hub-capture-actions',['Clear','Send to Inbox'],'custom'],
   ['Inbox','hub-inbox-dialog','hub-capture-header','hub-capture-actions',['Close'],'custom'],
   ['Make an Oath','hub-oath-dialog','hub-window-header','hub-oath-actions',['Cancel','Review Oath'],'shared'],
   ['Progress Report','hub-progress-editor','hub-window-header','hub-project-advancement-actions',['Keep working','Skip report','Save and close'],'shared'],
   ['Report viewer','hub-daily-report-modal','hub-window-header','hub-project-advancement-actions',['Edit report'],'shared'],
   ['Task editor','hub-task-live-dialog','hub-capture-header','hub-task-dialog-actions',['Cancel','Save task'],'form'],
   ['Planner','hub-plans-window','hub-capture-header','hub-planner-controls',['Focused','Full day','New Plan'],'planner'],
   ['Settings','hub-settings-dialog','hub-settings-header',null,[],'custom'],
   ['Statistics','hub-statistics-window','hub-statistics-header',null,[],'shared']
  ]) {
   const modalEl = make(families,'div','modal ' + modalClass);
   modalEl.style.inlineSize = 'min(660px, calc(100vw - 28px))';
   const contentEl = make(modalEl,'div','modal-content hub-button-scope');
   const modal = { modalEl, contentEl };
   const header = make(contentEl,'header',headerClass);
   header.style.minHeight = '32px';
   if (headerClass === 'hub-window-header') header.style.marginBottom = '11px';
   make(header,'h2','',name).style.margin = '0';
   const nested = mode === 'form' || mode === 'planner';
   const bodyOwner = nested ? make(contentEl, mode === 'form' ? 'form' : 'div', mode === 'planner' ? 'hub-plans hub-planner' : '') : contentEl;
   const body = make(bodyOwner,'section',mode === 'planner' ? 'hub-planner-stack' : 'content-region');
   body.style.minHeight = '64px';
   body.style.display = 'flow-root';
   const inside = make(body,'div','hub-project-advancement-divider is-context-divider');
   const footer = footerClass ? make(bodyOwner,'footer',footerClass) : null;
   for (const label of labels) make(footer,'button','',label);
   if (mode === 'shared' || mode === 'form') layoutModal(modal, { header, body, footer, container: bodyOwner });
   else mountModalSeparators(modal,{ header, footer });
   mountModalSeparators(modal,{ header, footer }); // Reusing layout must be idempotent.
   await settle();
   for (const [edge, region, line] of [['header',header,header.nextElementSibling],['footer',footer,footer?.previousElementSibling]]) {
    if (!region) continue;
    const lineStyle = getComputedStyle(line), frame = bounds(contentEl), separator = bounds(line);
    check(line.classList.contains('hub-modal-separator') && line.classList.contains('is-' + edge), name + ' has a separate ' + edge + ' divider');
    check(near(separator.left,frame.left) && near(separator.right,frame.right), name + ' ' + edge + ' follows both content insets');
    check(near(separator.height,1) && lineStyle.borderTopColor === expectedColor, name + ' ' + edge + ' uses the theme line');
    if (edge === 'header') {
     check(near(separator.top - bounds(header).bottom,16), name + ' fixed space above header divider');
     check(near(bounds(nested ? bodyOwner : body).top - separator.bottom,16), name + ' fixed space below header divider ' + (bounds(nested ? bodyOwner : body).top - separator.bottom));
    } else {
     check(near(separator.top - bounds(body).bottom,16), name + ' fixed space above footer divider ' + (separator.top - bounds(body).bottom));
     check(near(bounds(footer).top - separator.bottom,16), name + ' fixed space below footer divider');
     if (labels.length > 1 && mode !== 'planner') {
      check(bounds(footer).width < separator.width && near(bounds(footer).right,separator.right), name + ' dividers and action width are independent');
      check([...footer.children].every(button => near(bounds(button).width,bounds(footer.firstElementChild).width)), name + ' equal button widths');
     }
    }
   }
   check(modalEl.querySelectorAll('.hub-modal-separator').length === (footer ? 2 : 1), name + ' has only its window dividers');
   check(inside.parentElement === body && getComputedStyle(inside).borderTopWidth === '1px', name + ' retains its content divider');
   modalEl.remove();
  }
 }
 result.textContent = 'PASS: ' + checks + ' modal separator and button checks at ' + innerWidth + '×' + innerHeight + ' across light and dark themes.';
}catch(error){result.textContent='FAIL: '+error.stack}
</script>
