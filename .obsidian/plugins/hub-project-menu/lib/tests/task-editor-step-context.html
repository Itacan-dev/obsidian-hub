<!doctype html><meta charset="utf-8"><title>Task editor Step alignment and contextual controls</title>
<link rel="stylesheet" href="../../styles.css">
<style>#result{position:fixed;bottom:0;pointer-events:none}.modal-close-button{background:transparent!important;border:0!important;box-shadow:none!important}</style>
<body class="theme-dark"><pre id="result">RUNNING</pre>
<script type="module">
window.testDone=(async()=>{

  read:async()=>structuredClone(saved),create:async(_destination,_text,value)=>{saved=structuredClone(value);writes++},save:async(_snapshot,value)=>{saved=structuredClone(value);writes++;return saved}};

 };
