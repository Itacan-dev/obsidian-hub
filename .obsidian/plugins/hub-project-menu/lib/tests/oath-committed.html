<style>
body{color-scheme:dark;margin:0;background:#191b1e;color:#e0e4ef;font:16px system-ui;--background-primary:#202329;--background-secondary:#262a31;--text-normal:#e0e4ef;--text-muted:#a6afbe;--text-faint:#818996;--background-modifier-border:#3c424e;--background-modifier-hover:#ffffff0c;--interactive-accent:#5957da;--text-accent:#78c7ec;--text-on-accent:white;--color-red:#f5787e;--color-yellow:#ebbd58}
*{box-sizing:border-box}button,input{font:inherit;color:inherit;border:1px solid var(--background-modifier-border);border-radius:6px;background:var(--background-primary);padding:7px}button{cursor:pointer}input[type=checkbox]{width:16px;height:16px;accent-color:var(--interactive-accent)}button:disabled{opacity:.45}.app-container{height:100vh;display:flex;flex-direction:column}.horizontal-main-container{flex:1 0 0;min-height:0;overflow:auto;padding:24px}.status-bar{position:absolute;bottom:0;right:0;display:flex}.modal-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;z-index:10}.modal{background:var(--background-primary);border:1px solid var(--background-modifier-border);border-radius:12px;padding:26px;max-height:94vh;overflow:auto}.modal-close-button{float:right}#fixture{width:100%;max-width:1030px}.home-panel,.project-panel{padding:16px;border:1px solid var(--background-modifier-border);border-radius:12px}.home-tasks-body,.project-tasks-body{max-height:640px}#result{white-space:pre-wrap;font-size:11px}.hub-task-markdown p{margin:0}

<div class="app-container"><div class="horizontal-main-container"><div id="fixture"></div><pre id="result">RUNNING</pre></div><div class="status-bar"><span>Native status controls</span></div></div>
<script>
HTMLElement.prototype.createEl=function(tag,o={}){const e=document.createElement(tag);e.className=o.cls||'';e.textContent=o.text||'';for(const[k,v]of Object.entries(o.attr||{}))e.setAttribute(k,v);if(o.type)e.type=o.type;this.append(e);return e};
HTMLElement.prototype.createDiv=function(o){return this.createEl('div',o)};HTMLElement.prototype.createSpan=function(o){return this.createEl('span',o)};HTMLElement.prototype.empty=function(){this.replaceChildren()};
class Component{constructor(){this.children=new Set();this.cleanups=[]}load(){}register(fn){this.cleanups.push(fn)}addChild(c){this.children.add(c)}removeChild(c){c.unload();this.children.delete(c)}unload(){this.cleanups.splice(0).forEach(fn=>fn());this.children.forEach(c=>c.unload());this.children.clear()}}
class Modal{constructor(app){this.app=app;this.containerEl=document.createElement('div');this.containerEl.className='modal-container';this.modalEl=this.containerEl.createDiv({cls:'modal'});this.modalEl.createEl('button',{text:'×',cls:'modal-close-button'}).onclick=()=>this.close();this.contentEl=this.modalEl.createDiv({cls:'modal-content'});this.escape=e=>{if(e.key==='Escape'&&this.containerEl===[...document.querySelectorAll('.modal-container')].at(-1))this.close()}}open(){document.body.append(this.containerEl);document.addEventListener('keydown',this.escape);this.onOpen()}close(){this.onClose?.();this.containerEl.remove();document.removeEventListener('keydown',this.escape)}}
let sourcePicker;
const notices=[],obsidian={Component,Modal,Menu:class{
 constructor(){this.items=[]}
 addItem(build){const item={setTitle(value){this.title=value;return this},setChecked(value){this.checked=value;return this},onClick(fn){this.action=fn;return this}};build(item);this.items.push(item);return this}
 onHide(fn){this.onhide=fn;return this}
 showAtPosition(point){
  this.el=document.body.createDiv({cls:'menu'});Object.assign(this.el.style,{position:'fixed',left:point.x+'px',top:point.y+'px',zIndex:100});
  for(const item of this.items){const b=this.el.createEl('button',{text:item.title,attr:{role:'menuitemradio','aria-checked':String(item.checked)}});b.onclick=()=>{item.action();this.hide()}}
  this.outside=event=>{if(!this.el.contains(event.target))this.hide()};
  this.escape=event=>{if(event.key==='Escape'){event.preventDefault();event.stopImmediatePropagation();this.hide()}};
  document.addEventListener('pointerdown',this.outside);document.addEventListener('keydown',this.escape,true);this.el.querySelector('button').focus();
 }
 hide(){if(!this.el?.isConnected)return;this.el.remove();document.removeEventListener('pointerdown',this.outside);document.removeEventListener('keydown',this.escape,true);this.onhide?.()}
},FuzzySuggestModal:class{open(){sourcePicker=this}},Notice:class{constructor(text){notices.push(text)}},setIcon:(el,name)=>{el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="'+(name==='shield'?'M12 3L21 7V13Q20 18 12 22Q4 18 3 13V7Z':'M8 3L18 13M7 4L5 10L14 19L20 17M11 14L3 22')+'"/></svg>'},MarkdownRenderer:{render:async(app,text,el)=>el.createEl('p',{text})}};

 "scroll-text":"<path d=\"M15 12h-5\"/><path d=\"M15 8h-5\"/><path d=\"M19 17V5a2 2 0 0 0-2-2H4\"/><path d=\"M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3\"/>",

 'list-todo':'<rect x="3" y="4" width="4" height="4" rx="1"/><path d="m3 16 2 2 3-4M11 6h10M11 16h10"/>'
};
Object.assign(iconShapes,{'chevron-right':'<path d="m9 6 6 6-6 6"/>','chevron-down':'<path d="m6 9 6 6 6-6"/>'});
obsidian.getIcon=name=>name==='lucide-folder'?document.createElementNS('http://www.w3.org/2000/svg','svg'):null;
const fallbackIcon=obsidian.setIcon;obsidian.setIcon=(el,name)=>{el.dataset.icon=name==='folder'?'folder-open':name;name=name.startsWith('lucide-')?name.slice(7):name==='fullscreen'?'maximize':name;if(iconShapes[name])el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+iconShapes[name]+'</svg>';else fallbackIcon(el,name)};
const assert=(ok,message)=>{if(!ok)throw Error(message)};
const isBlocked=button=>button.disabled||button.getAttribute('aria-disabled')==='true';
const click=(scope,text)=>{const button=[...scope.querySelectorAll('button')].find(el=>el.textContent===text||el.getAttribute('aria-label')===text)||[...scope.querySelectorAll('.hub-oath-choice')].find(el=>(el.querySelector('.hub-oath-choice-title')?.textContent===text||el.querySelector('input[type=radio]')?.value===text.toLowerCase()))?.querySelector('input');assert(button,'Missing control '+text);button.click();return button};
const selectSuggestion=screen=>screen.querySelector('.hub-oath-task-option:not(.is-selected)')?.click();
const modal=()=>[...document.querySelectorAll('.modal-content')].at(-1);
const settle=async()=>{for(let i=0;i<80;i++)await Promise.resolve();await new Promise(r=>requestAnimationFrame(r))};
const runtimeErrors=[];
window.addEventListener('error',event=>runtimeErrors.push(event.message));
window.addEventListener('unhandledrejection',event=>runtimeErrors.push(String(event.reason)));
