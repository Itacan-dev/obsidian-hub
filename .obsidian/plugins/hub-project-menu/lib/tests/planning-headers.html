<!doctype html><meta charset="utf-8"><title>Planning editor headers</title>
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;font:14px Arial;background:#222;color:#ddd;--text-normal:#ddd;--text-muted:#aaa;--background-primary:#222;--background-secondary:#292929;--background-modifier-border:#555;--interactive-accent:#8955ed;--text-on-accent:#fff;--input-shadow:none}
*{box-sizing:border-box}.modal-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0008}.modal{position:relative;padding:24px;background:#292929;max-height:90vh;overflow:auto;width:min(680px,calc(100vw - 48px));border:1px solid #555;border-radius:12px}.modal-content{width:100%}.modal-close-button{position:absolute;right:8px;top:8px;z-index:1}button,input,textarea,select{font:inherit;color:inherit;background:#333}#result{position:fixed;bottom:0;z-index:9;font-size:10px;white-space:normal;background:#222;pointer-events:none}
</style><pre id="result">RUNNING</pre>
<script type="module">
HTMLElement.prototype.createEl=function(tag,o={}){const el=document.createElement(tag);el.className=o.cls||'';el.textContent=o.text??'';if(o.type)el.type=o.type;for(const[k,v]of Object.entries(o.attr||{}))el.setAttribute(k,v);this.append(el);return el};
HTMLElement.prototype.createDiv=function(o){return this.createEl('div',o)};HTMLElement.prototype.createSpan=function(o){return this.createEl('span',o)};HTMLElement.prototype.empty=function(){this.replaceChildren()};
let checks=0;const check=(value,message)=>{checks++;if(!value)throw Error(message)},near=(a,b)=>Math.abs(a-b)<1,settle=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const key=value=>new Promise(resolve=>{window.hubTestKeyDone=resolve;window.hubTestKeyRequest=value});
class Modal{constructor(app){this.app=app;this.containerEl=document.body.createDiv({cls:'modal-container'});this.modalEl=this.containerEl.createDiv({cls:'modal'});this.contentEl=this.modalEl.createDiv({cls:'modal-content'});this.closeButton=this.modalEl.createEl('button',{cls:'modal-close-button',text:'×',attr:{'aria-label':'Close'}});this.closeButton.onclick=()=>this.close();this.escape=event=>{if(event.key==='Escape')this.close()}}open(){this.onOpen();document.addEventListener('keydown',this.escape)}close(){this.onClose?.();this.containerEl.remove();document.removeEventListener('keydown',this.escape)}}
// Representative Lucide outlines; the production setIcon call receives the exact approved names.
const native={Modal,FuzzySuggestModal:class{},setIcon(el,name){el.dataset.icon=name;const paths=name==='layers'?['m12 3 10 5-10 5L2 8Z','m2 12 10 5 10-5','m2 17 10 5 10-5']:['M4 22V2','M4 3c4-4 8 4 12 0v12c-4 4-8-4-12 0'];el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+paths.map(d=>'<path d="'+d+'"/>').join('')+'</svg>'}};
async function load(name,require=()=>{}){const module={exports:{}};new Function('module','require',await(await fetch('../'+name+'.js')).text())(module,require);return module.exports}
try{
 const dates=await load('domain/dates'),focus=await load('ui/focus-restoration'),title=await load('ui/window-title',()=>native),planning=await load('ui/planning-editor',name=>name==='obsidian'?native:name==='./window-title'?title:name==='./focus-restoration'?focus:dates);
 for(const kind of ['phases','milestones'])for(const editing of [false,true]){
  const phase=kind==='phases',noun=phase?'phase':'milestone',value=editing?{id:'item',name:'Existing '+noun,start:'2026-10-10',end:'2026-10-11',date:'2026-10-10',description:'Existing description',achieved:true}:null;
  const saves=[];let pending;const service={plugin:{app:{}},read:()=>({revision:7,phases:[]}),tasks:()=>Array.from({length:24},(_,i)=>({hubTaskId:'t'+i,text:'Associated task '+i,path:'Projects/P/Tasks.md',phaseId:'item'})),savePhase(id,data,assignments,revision){saves.push({id,data,assignments,revision});return new Promise((resolve,reject)=>pending={resolve,reject})},saveMilestone(id,data,revision){saves.push({id,data,revision});return new Promise((resolve,reject)=>pending={resolve,reject})}};
  const modal=planning.openPlanningEditor(service,'p',kind,value,{}),root=modal.contentEl,header=root.querySelector(':scope > .hub-window-header'),heading=header.querySelector('h2'),subtitle=header.querySelector('p'),graphic=header.querySelector('.hub-window-title-icon'),copy=header.querySelector('.hub-window-header-copy'),body=root.querySelector('.hub-modal-body'),form=root.querySelector('form'),footer=root.querySelector('.hub-task-dialog-actions'),input=root.querySelector('input[type=text]');await settle();
  check(heading.textContent===(editing?'Edit ':'Add ')+noun,'Approved title');check(subtitle.textContent===(phase?"Organise a stage of your project's roadmap.":"Set a key date in your project's roadmap."),'Approved subtitle');check(graphic.dataset.icon===(phase?'layers':'flag')&&graphic.getAttribute('aria-hidden')==='true','Approved decorative icon');
  const rect=node=>node.getBoundingClientRect(),g=rect(graphic),c=rect(copy),svg=rect(graphic.querySelector('svg'));
  check(near(g.width,44)&&near(g.height,44)&&near(svg.width,44)&&near(svg.height,44),'44px icon');check(near(c.left-g.right,14),'14px column gap');check(near(rect(subtitle).top-rect(heading).bottom,6),'6px subtitle gap');check(near(g.top+g.height/2,c.top+c.height/2),'Icon centered on full text group');
  const reference=root.createEl('h2',{cls:'hub-task-dialog-title',text:'Reference'}),referenceSubtitle=root.createEl('p',{cls:'hub-oath-muted',text:'Reference'});for(const property of ['fontSize','fontWeight','lineHeight','color']){check(getComputedStyle(heading)[property]===getComputedStyle(reference)[property],'Shared title '+property);check(getComputedStyle(subtitle)[property]===getComputedStyle(referenceSubtitle)[property],'Shared subtitle '+property)}reference.remove();referenceSubtitle.remove();
  check(!body.contains(header)&&!body.contains(footer)&&body.closest('form')===footer.closest('form'),'Fixed regions preserve form ownership');check(!root.querySelector('.hub-project-advancement-divider,.hub-oath-header-divider'),'No separator introduced');check(document.activeElement===input,'Initial field focus retained');check(root.scrollWidth<=root.clientWidth+10&&modal.modalEl.scrollWidth<=modal.modalEl.clientWidth+1,'No horizontal clipping');
  const bounds=rect(modal.modalEl),limit=Math.min(900,innerHeight*.85,innerHeight-48);check(bounds.height<=limit+1&&bounds.top>=0&&bounds.bottom<=innerHeight,'Shared height cap and centered viewport fit');check(rect(footer).bottom<=bounds.bottom&&rect(header).top>=bounds.top,'Header/footer visible');
  if(!editing){check(!form.checkValidity(),'Empty title validation retained');input.focus();await key('Enter');check(saves.length===0&&document.activeElement===input,'Invalid submission focuses title without saving')}
  input.value='Updated '+noun;check(form.checkValidity(),'Valid fields accepted');
  // User-resized phase descriptions exercise overflow with actual editor content.
  const description=root.querySelector('textarea');if(description)description.style.height='1000px';await settle();const positions=[header,footer,modal.closeButton].map(node=>[rect(node).top,rect(node).bottom]);
  for(const fraction of [0,.5,1,0]){body.scrollTop=(body.scrollHeight-body.clientHeight)*fraction;await settle();check(JSON.stringify([header,footer,modal.closeButton].map(node=>[rect(node).top,rect(node).bottom]))===JSON.stringify(positions),'Header/footer/close stationary during body scrolling');check(root.scrollTop===0&&modal.modalEl.scrollTop===0,'Only body scrolls')}
  if(description)check(body.scrollHeight>body.clientHeight,'Long content scrolls inside body');else if(innerHeight>=850)check(body.scrollHeight<=body.clientHeight,'Short milestone has no needless scrolling');
  const submit=footer.querySelector('[type=submit]');submit.focus();await key('Enter');await settle();check(saves.length===1&&modal.saving,'Keyboard save begins once');check([...form.querySelectorAll('input,textarea,button')].every(control=>control.disabled),'Fields and actions locked during save');form.dispatchEvent(new Event('submit',{cancelable:true}));modal.closeButton.click();await key('Escape');check(modal.containerEl.isConnected&&saves.length===1,'Pending save blocks repeated submit, close, Escape');
  pending.reject(Error('Persistence failed'));await settle();check(!modal.saving&&input.value==='Updated '+noun&&[...form.querySelectorAll('input,textarea,button')].every(control=>!control.disabled),'Failure preserves input and restores controls');check(root.querySelector('[role=alert]').textContent==='Persistence failed','Existing save error remains visible');
  submit.focus();await key('Enter');await settle();check(saves.length===2,'Retry submits once');check(saves[1].revision===7&&saves[1].data.name==='Updated '+noun,'Persistence values and revision retained');pending.resolve();await settle();check(!modal.containerEl.isConnected,'Successful persistence closes normally');
  for(const dismissal of ['Escape','Close','Cancel']){const other=planning.openPlanningEditor(service,'p',kind,value,{});if(dismissal==='Escape')await key('Escape');else if(dismissal==='Close')other.closeButton.click();else [...other.contentEl.querySelectorAll('button')].find(button=>button.textContent==='Cancel').click();check(!other.containerEl.isConnected,'Idle '+dismissal+' dismissal retained')}
 }
 const preview=new URLSearchParams(location.search).get('preview');if(preview){const phase=preview==='phase';planning.openPlanningEditor({plugin:{app:{}},read:()=>({revision:1,phases:[]}),tasks:()=>[]},'p',phase?'phases':'milestones',{id:'preview',name:phase?'Implementation':'First release',start:'2026-10-10',end:'2026-10-20',date:'2026-10-20',description:'Organise the work for the next stage.'},{})}
 result.textContent='PASS: '+checks+' checks at '+innerWidth+'×'+innerHeight+'; actual Add/Edit Phase and Milestone headers, shared geometry/typography, fixed modal regions, natural/long content, validation, focus, pending-save guards, failure/retry, persistence and dismissal.';
}catch(error){result.textContent='FAIL '+error.stack}
