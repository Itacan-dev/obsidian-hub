<!doctype html>
<meta charset="utf-8">
<title>Home Calendar presentation and navigation</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../../../../System/Dashboards/Home/view.css">
<style>
body {
    margin: 12px;
    background: #191919;
    color: #ddd;
    font: 16px system-ui;
    --background-primary: #191919;
    --background-secondary: #262626;
    --background-modifier-border: #383838;
    --text-normal: #ddd;
    --text-muted: #aaa;
    --text-faint: #777;
    --interactive-accent: #8961ff;
    --scrollbar-native-width: auto;
}
body.theme-light {
    background: #fff;
    color: #222;
    --background-primary: #fff;
    --background-secondary: #f6f6f6;
    --background-modifier-border: #ddd;
    --text-normal: #222;
    --text-muted: #555;
    --text-faint: #777;
    --interactive-accent: #6545b8;
}
.host { width: 478px; margin-bottom: 12px; }
.home-dashboard { padding: 0; }
.home-panel-title { display: flex; }
button { background: var(--background-primary); color: inherit; border: 1px solid var(--background-modifier-border); border-radius: 6px; }
#result { white-space: pre-wrap; }
</style>
<body class="theme-dark"><div id="fixtures"></div><pre id="result">RUNNING</pre>
<script>
HTMLElement.prototype.createEl = function(tag, options = {}) {
    const element = document.createElement(tag);
    element.className = options.cls || '';
    element.textContent = options.text || '';
    for (const [key, value] of Object.entries(options.attr || {})) element.setAttribute(key, value);
    this.append(element);
    return element;
};
HTMLElement.prototype.createDiv = function(options) { return this.createEl('div', options); };
HTMLElement.prototype.createSpan = function(options) { return this.createEl('span', options); };

let checks = 0;
function assert(condition, message) {
    checks++;
    if (!condition) throw Error(message);
}
async function settle() {
    for (let index = 0; index < 4; index++) {
        await new Promise(resolve => setTimeout(resolve, 0));
        await new Promise(resolve => requestAnimationFrame(resolve));
    }
}
const runtimeErrors = [];
window.addEventListener('error', event => runtimeErrors.push(event.message));
window.addEventListener('unhandledrejection', event => runtimeErrors.push(String(event.reason)));

// Keep the production date helpers and supply deterministic local calendar arithmetic.
let clock = new Date(2026, 8, 22, 14).getTime();
const pad = value => String(value).padStart(2, '0');
class LocalMoment {
    constructor(value) {
        if (value instanceof LocalMoment) value = value.valueOf();
        if (value === undefined) value = clock;
        if (typeof value === 'string' && value.length === 10) value += 'T00:00:00';
        this.dateValue = new Date(value);
    }
    year() { return this.dateValue.getFullYear(); }
    month() { return this.dateValue.getMonth(); }
    date() { return this.dateValue.getDate(); }
    day() { return this.dateValue.getDay(); }
    hour() { return this.dateValue.getHours(); }
    minute() { return this.dateValue.getMinutes(); }
    clone() { return new LocalMoment(this); }
    valueOf() { return this.dateValue.getTime(); }
    add(count, unit) {
        assert(unit === 'days', 'Calendar uses local day arithmetic');
        this.dateValue.setDate(this.dateValue.getDate() + count);
        return this;
    }
    startOf(unit) {
        this.dateValue.setHours(0, 0, 0, 0);
        if (unit === 'isoWeek') this.dateValue.setDate(this.dateValue.getDate() - (this.day() + 6) % 7);
        else assert(unit === 'day', 'Known start boundary');
        return this;
    }
    endOf(unit) {
        assert(unit === 'day', 'Known end boundary');
        this.dateValue.setHours(23, 59, 59, 999);
        return this;
    }
    format(pattern) {
        if (pattern === 'YYYY-MM-DD') return this.year() + '-' + pad(this.month() + 1) + '-' + pad(this.date());
        assert(pattern === undefined, 'Known date format');
        return this.dateValue.toISOString();
    }
}
const moment = value => new LocalMoment(value);
const timers = new Map();
let timerId = 0;
function every(callback, delay) {
    assert(delay === 60000, 'One minute interval');
    timers.set(++timerId, callback);
    return timerId;
}
async function tick(value) {
    clock = new Date(value).getTime();
    await Promise.all([...timers.values()].map(callback => callback()));
    await settle();
}
const observers = new Set();
class CalendarResizeObserver extends ResizeObserver {
    constructor(callback) { super(callback); observers.add(this); }
    disconnect() { super.disconnect(); observers.delete(this); }
}
const event = (time, title, extra = {}) => ({
    start: moment('2026-09-22T' + time + ':00'), title, calendarColor: '#80c8c8', ...extra
});

window.onload = async () => {
    try {
        const nativeCss = new URLSearchParams(location.search).get('preview');
        if (nativeCss) {
            const stylesheet = document.createElement('link');
            stylesheet.rel = 'stylesheet';
            stylesheet.href = nativeCss;
            await new Promise((resolve, reject) => {
                stylesheet.onload = resolve;
                stylesheet.onerror = reject;
                document.head.prepend(stylesheet);
            });
        }
        const read = async file => (await fetch(file)).text();
        const [dateSource, paletteSource, colorSource, frameSource, homeSource] = await Promise.all([
            read('../domain/dates.js'), read('../ui/color-palettes.js'), read('../ui/color-system.js'),
            read('../ui/dashboard-frame.js'), read('../../../../../System/Dashboards/Home/view.js')
        ]);
        function load(source, require = () => { throw Error('Unexpected dependency'); }) {
            const module = { exports: {} };
            new Function('module', 'require', source)(module, require);
            return module.exports;
        }
        const dates = load(dateSource);
        const palettes = load(paletteSource);
        const colors = load(colorSource, request => {
            assert(request === './color-palettes', 'Color palette dependency');
            return palettes;
        });
        const frames = load(frameSource, request => {
            if (request === './color-system') return colors;
            assert(request === './header-image', 'Frame dependency');
            return { refreshHeaderImages() {} };
        });
        const agenda = homeSource.slice(homeSource.indexOf('calendarTodayButton.disabled = true;'), homeSource.indexOf('// ---------- PROJECTS ----------'));
        const build = new Function('dv', 'app', 'frame', 'calendar', 'calendarHeader', 'calendarTodayButton',
            'moment', 'el', 'setInterval', 'clearInterval', 'ResizeObserver', 'formatTime', 'formatDate', 'formatWeekday',
            'let homeCalendarEventCount = null; const updateHomeContext = () => {}; ' + agenda +
            ';return { body: calendarBody, refresh: refreshCalendarDates, render: renderCalendarWeek, load: loadNextCalendarWeek, get summary() { return homeCalendarEventCount; } };');
        const originalOpen = window.open;
        let openings = 0;
        window.open = () => { openings++; };

        async function mount(events = [], options = {}) {
            const host = options.host || document.getElementById('fixtures').createDiv({ cls: 'host' });
            const cleanups = [];
            const owner = {
                hubDeferFrameActivation: !!options.prepared,
                register: callback => cleanups.push(callback),
                unload() { cleanups.splice(0).forEach(callback => callback()); }
            };
            const frame = frames.createDashboardFrame(host, owner, 'home-dashboard hub-button-scope');
            const panel = frame.root.createDiv({ cls: 'home-panel home-calendar hub-scrollbar' });
            const header = panel.createDiv({ cls: 'home-panel-title', text: 'Calendar' });
            const today = header.createEl('button', { cls: 'home-calendar-today hub-panel-action', text: 'Today' });
            const queries = [], scrolls = [];
            const nativeScroll = panel.scrollTo.bind(panel);
            panel.scrollTo = options => { scrolls.push(options); nativeScroll(options); };
            const provider = {
                async runQuery(query) {
                    queries.push(query);
                    if (options.error) throw Error(options.error);
                    return {
                        events: events.filter(item => item.start.valueOf() >= query.from.valueOf() && item.start.valueOf() <= query.to.valueOf()),
                        warnings: options.warnings || []
                    };
                }
            };
            const app = { plugins: { plugins: options.enabled === false ? {} : { 'google-calendar-agenda': provider } } };
            const controls = build({ container: host, component: owner }, app, frame, panel, header, today,
                moment, (parent, tag, cls, text) => parent.createEl(tag, { cls, text }), every, id => timers.delete(id), CalendarResizeObserver,
                dates.formatTime, dates.formatDate, dates.formatWeekday);
            const view = Object.assign(controls, { host, owner, frame, panel, header, today, queries, scrolls });
            frame.commit();
            await settle();
            return view;
        }
        const day = view => view.body.querySelector('.home-calendar-day.is-today');
        const heading = view => day(view).querySelector('.home-calendar-day-heading');
        const order = view => [...day(view).querySelectorAll('.home-calendar-title')].map(title => title.textContent).join('|');
        const visible = view => {
            const target = heading(view).getBoundingClientRect();
            const panel = view.panel.getBoundingClientRect();
            return target.top >= view.header.getBoundingClientRect().bottom && target.bottom <= panel.bottom - view.panel.clientTop;
        };
        const checkContentInsets = view => {
            const panel = view.panel.getBoundingClientRect();
            const scale = panel.height / view.panel.offsetHeight;
            const left = panel.left + view.panel.clientLeft * scale;
            const right = left + view.panel.clientWidth * scale;
            const row = day(view).querySelector('.home-calendar-row');
            const time = row.querySelector('.home-calendar-time').getBoundingClientRect();
            const info = row.querySelector('.home-calendar-info').getBoundingClientRect();
            assert(Math.abs((time.left - left) / scale - 12) < 1, 'Twelve-pixel effective leading clearance');
            assert(Math.abs((right - info.right) / scale - 12) < 1, 'Twelve-pixel clearance before the scrollbar');
        };
        const dispose = view => { view.owner.unload(); view.host.remove(); };
        const originals = [
            event('00:00', 'Semana 47 de 2026', { allDay: true }),
            event('09:00', 'Morning'),
            event('16:00', 'Afternoon', { location: 'Existing location', link: 'https://example.test/event' }),
            event('16:00', 'Same start', { meetUrl: 'https://meet.example.test/meeting' }),
            event('20:00', 'Evening', { link: 'invalid URL' })
        ];
        let view = await mount(originals);
        assert(order(view) === 'Semana 47 de 2026|Morning|Afternoon|Same start|Evening', 'Start-time ordering including ties and imported all-day events');
        assert(day(view).querySelector('.home-calendar-time').textContent === 'All day', 'Imported week-named event retains its all-day label');
        assert(!view.body.querySelector('.home-calendar-week-heading,.home-calendar-week-number,.home-calendar-week-range'), 'Generated week heading and metadata are absent');
        assert(heading(view).textContent === 'Today \u00b7 Tue 22 Sep', 'Relative heading uses English presentation helpers');
        assert(view.body.querySelector('[data-calendar-date="2026-09-23"] .home-calendar-day-heading').textContent === 'Tomorrow \u00b7 Wed 23 Sep', 'Tomorrow heading');
        assert(visible(view) && view.today.disabled && view.scrolls.length === 1 && view.scrolls[0].behavior === 'auto', 'Initial navigation positions today once');
        assert(day(view).querySelector('.home-calendar-row').getBoundingClientRect().bottom <= view.panel.getBoundingClientRect().bottom, 'Initial view includes all-day events');
        assert(view.queries.length === 1 && view.queries[0].allDay === 'include' && view.queries[0].limit === 100 &&
            view.queries[0].hideDeclined && view.queries[0].hideCancelled && view.queries[0].refresh === 0, 'Google query options');
        assert(view.summary === 4, 'Summary retains all-day, upcoming, and equal-start events');
        assert(!view.body.querySelector('.home-calendar-now,.home-calendar-dot'), 'No time indicator or colored bars');
        assert(!view.body.querySelector('a,button,[tabindex],[role=button],[role=link]'), 'Events add no interactive elements or tab stops');
        const rows = [...day(view).querySelectorAll('.home-calendar-row')];
        for (const row of rows) {
            const title = row.querySelector('.home-calendar-title');
            assert(title.tagName === 'SPAN' && title.title === title.textContent, 'Static title retains full tooltip text');
            assert(getComputedStyle(title).cursor !== 'pointer' && getComputedStyle(row).cursor !== 'pointer', 'Static cursors');
            title.click();
            for (const key of ['Enter', ' ']) title.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
            row.click();
        }
        assert(openings === 0, 'URLs never activate event opening');
        assert(getComputedStyle(rows[0], '::before').content === 'none' && getComputedStyle(rows[1], '::before').borderTopWidth === '1px', 'Only adjacent events have dividers');
        assert(Math.abs(rows[0].querySelector('.home-calendar-time').getBoundingClientRect().left - heading(view).getBoundingClientRect().left) < 1, 'Heading and row use one content edge');
        checkContentInsets(view);
        const tomorrow = day(view).nextElementSibling;
        assert(Math.abs(tomorrow.getBoundingClientRect().top - day(view).getBoundingClientRect().bottom - 8) < 1, 'Eight-pixel separation between day groups');
        assert(getComputedStyle(rows[0].querySelector('.home-calendar-title')).fontWeight === '400' &&
            getComputedStyle(rows[0].querySelector('.home-calendar-time')).fontWeight === '400' &&
            parseFloat(getComputedStyle(heading(view)).fontSize) > parseFloat(getComputedStyle(rows[0].querySelector('.home-calendar-time')).fontSize), 'Day headings lead regular-weight event text');
        assert(rows[0].getBoundingClientRect().height < 32, 'Single-line events keep compact row height');
        view.panel.scrollTop = 0;
        await settle();
        const scrollTop = view.panel.scrollTop, calls = view.scrolls.length;
        await tick('2026-09-22T23:05:00');
        assert(view.panel.scrollTop === scrollTop && view.scrolls.length === calls, 'Clock updates never navigate');
        assert(rows.every((row, index) => day(view).querySelectorAll('.home-calendar-row')[index] === row), 'Clock retains event DOM');
        view.panel.scrollTop = view.panel.scrollHeight;
        await settle();
        assert(!view.today.disabled, 'Today enabled when heading is out of view');
        const beforeToday = view.scrolls.length;
        view.today.click();
        await settle();
        assert(visible(view) && view.today.disabled && view.scrolls.length === beforeToday + 1, 'Today returns to heading');
        view.panel.style.height = '40px';
        await settle();
        assert(!view.today.disabled, 'Resize observer enables Today when heading cannot fit');
        view.panel.style.height = '320px';
        await settle();
        assert(view.today.disabled === visible(view), 'Resize observer restores correct Today state');
        const nextDay = view.body.querySelector('[data-calendar-date="2026-09-23"]');
        view.panel.scrollTop += nextDay.getBoundingClientRect().top - view.header.getBoundingClientRect().bottom;
        await settle();
        const rolloverScroll = view.panel.scrollTop, rolloverCalls = view.scrolls.length;
        await tick('2026-09-23T00:00:00');
        assert(day(view).dataset.calendarDate === '2026-09-23' && heading(view).textContent === 'Today \u00b7 Wed 23 Sep', 'Midnight updates today');
        assert(view.body.querySelector('[data-calendar-date="2026-09-22"] .home-calendar-day-heading').textContent === 'Tue 22 Sep', 'Previous relative heading cleared');
        assert(view.body.querySelector('[data-calendar-date="2026-09-24"] .home-calendar-day-heading').textContent === 'Tomorrow \u00b7 Thu 24 Sep', 'Tomorrow advances at midnight');
        assert(view.panel.scrollTop === rolloverScroll && view.scrolls.length === rolloverCalls, 'Midnight preserves viewport');
        dispose(view);
        assert(timers.size === 0 && observers.size === 0, 'Unload clears clock and resize observation');

        clock = new Date(2026, 8, 22, 14).getTime();
        view = await mount([event('09:00', 'Tomorrow appointment', { start: moment('2026-09-23T09:00:00') })]);
        assert(day(view).textContent.includes('No events'), 'Empty today remains visible');
        const empty = day(view).querySelector('.home-calendar-day-empty');
        const nextDayInfo = day(view).nextElementSibling.querySelector('.home-calendar-info');
        assert(Math.abs(empty.getBoundingClientRect().left + parseFloat(getComputedStyle(empty).paddingLeft) -
            nextDayInfo.getBoundingClientRect().left) < 1, 'Empty state aligns with event content column');
        const old = view;
        view = await mount(originals, { host: old.host });
        old.owner.unload();
        assert(timers.size === 1 && observers.size === 1 && !old.frame.current(), 'Same-container rerender replaces clock and observer');
        const root = view.frame.root;
        root.remove();
        await tick('2026-09-22T23:59:00');
        view.host.append(root);
        await tick('2026-09-23T00:00:00');
        assert(heading(view).textContent === 'Today \u00b7 Wed 23 Sep' && timers.size === 1, 'Cached detached frame catches up');
        const second = await mount([]);
        assert(timers.size === 2 && observers.size === 2, 'Separate leaves own separate resources');
        dispose(second);
        dispose(view);

        clock = new Date(2026, 8, 27, 23, 59).getTime();
        view = await mount([]);
        const boundaryScroll = view.panel.scrollTop, boundaryCalls = view.scrolls.length;
        await tick('2026-09-28T00:00:00');
        assert(day(view).dataset.calendarDate === '2026-09-28' && view.queries.length === 2, 'Sunday midnight loads next week');
        assert(view.panel.scrollTop === boundaryScroll && view.scrolls.length === boundaryCalls, 'Week rollover preserves viewport');
        const previousDay = day(view).parentElement.previousElementSibling.lastElementChild;
        assert(previousDay.dataset.calendarDate === '2026-09-27' &&
            Math.abs(day(view).getBoundingClientRect().top - previousDay.getBoundingClientRect().bottom - 8) < 1,
            'Week boundary uses the same eight-pixel day gap');
        assert(getComputedStyle(day(view).parentElement).borderTopWidth === '0px' &&
            getComputedStyle(day(view).parentElement).paddingTop === '0px', 'Week boundary adds no heading separator or padding');
        await tick('2026-10-12T10:00:00');
        assert(day(view).dataset.calendarDate === '2026-10-12' && view.body.querySelectorAll('.is-today').length === 1, 'Wake catches up across weeks');
        dispose(view);
        clock = new Date(2026, 2, 29, 1, 59).getTime();
        view = await mount([]);
        await tick('2026-03-29T03:00:00');
        assert(day(view).dataset.calendarDate === '2026-03-29' && heading(view).textContent === 'Today \u00b7 Sun 29 Mar', 'DST keeps local calendar day');
        dispose(view);
        view = await mount([], { enabled: false });
        assert(view.body.textContent.includes('Google Calendar Agenda is not enabled.') && view.today.disabled, 'Missing plugin message');
        dispose(view);
        view = await mount([], { error: 'Synthetic calendar failure' });
        await view.load();
        assert(view.body.querySelectorAll('.home-empty').length === 1 && view.today.disabled, 'Query failure stops duplicate loading');
        dispose(view);
        view = await mount([], { warnings: ['Synthetic provider warning'] });
        assert(view.body.querySelector('.home-calendar-warning').textContent === 'Synthetic provider warning', 'Provider warnings retained');
        dispose(view);

        clock = new Date(2026, 11, 31, 23, 59).getTime();
        view = await mount([]);
        const crossYearWeek = view.body.querySelector('.home-calendar-week');
        assert(crossYearWeek.children.length === 7 && crossYearWeek.firstElementChild.dataset.calendarDate === '2026-12-28' &&
            crossYearWeek.lastElementChild.dataset.calendarDate === '2027-01-03', 'Cross-year week grouping contains only its seven days');
        assert(view.body.querySelector('[data-calendar-date="2027-01-01"] .home-calendar-day-heading').textContent === 'Tomorrow \u00b7 Fri 1 Jan 2027', 'Future year appears in heading');
        await tick('2027-01-01T00:00:00');
        assert(heading(view).textContent === 'Today \u00b7 Fri 1 Jan', 'Year rollover refreshes headings');
        assert(view.body.querySelector('[data-calendar-date="2026-12-31"] .home-calendar-day-heading').textContent === 'Thu 31 Dec 2026', 'Prior year remains explicit');
        dispose(view);

        clock = new Date(2026, 8, 22, 14).getTime();
        const longTitle = 'Review ' + 'unbroken'.repeat(25) + ' with a long event description';
        const longLocation = 'An exceptionally long location that must remain on one line in a compact Calendar panel';
        view = await mount([event('09:00', longTitle, { location: longLocation }), ...originals]);
        const long = [...view.body.querySelectorAll('.home-calendar-title')].find(title => title.textContent === longTitle);
        for (const zoom of [1, 1.25, 1.75]) {
            view.host.style.width = '320px';
            view.frame.root.style.zoom = zoom;
            await settle();
            assert(view.panel.scrollWidth <= view.panel.clientWidth + 1, 'No horizontal overflow at zoom ' + zoom);
            checkContentInsets(view);
            assert(long.offsetHeight <= parseFloat(getComputedStyle(long).lineHeight) * 2 + 1, 'Title limited to two lines at zoom ' + zoom);
            assert(long.offsetHeight > parseFloat(getComputedStyle(long).lineHeight), 'Long title wraps at zoom ' + zoom);
            const location = long.parentElement.querySelector('.home-calendar-location');
            assert(location.title === longLocation && location.scrollWidth > location.clientWidth, 'Full location retained behind ellipsis');
            view.panel.scrollTop = view.panel.scrollHeight;
            await settle();
            view.today.click();
            await settle();
            assert(visible(view), 'Today navigation respects CSS zoom ' + zoom);
        }
        view.frame.root.style.zoom = 1;
        const colorProbe = document.createElement('span');
        view.frame.root.append(colorProbe);
        for (const palette of palettes.PALETTES) {
            for (const coordinated of [false, true]) {
                colors.applyResolvedColors(palettes.resolvePalette({ version: 1, paletteId: palette.id, coordinateInterfaceColors: coordinated }));
                for (const theme of ['theme-dark', 'theme-light']) {
                    document.body.className = theme;
                    await settle();
                    colorProbe.style.color = 'var(--text-normal)';
                    assert(getComputedStyle(long).color === getComputedStyle(colorProbe).color, 'Neutral title in ' + palette.id + ' ' + theme);
                    assert(getComputedStyle(heading(view)).color === getComputedStyle(colorProbe).color, 'Clear neutral day heading in ' + palette.id + ' ' + theme);
                    colorProbe.style.color = 'var(--text-muted)';
                    assert(getComputedStyle(long.parentElement.querySelector('.home-calendar-location')).color === getComputedStyle(colorProbe).color, 'Muted location in ' + palette.id + ' ' + theme);
                    assert(getComputedStyle(view.panel).scrollbarWidth === 'auto', 'Host Calendar scrollbar in ' + theme);
                }
            }
        }
        colors.applyResolvedColors(palettes.resolvePalette(null));
        document.body.className = 'theme-dark';
        colorProbe.remove();
        dispose(view);

        const detached = document.createElement('div');
        detached.className = 'host';
        view = await mount(originals, { host: detached, prepared: true });
        assert(view.queries.length === 0 && timers.size === 0, 'Prepared Home waits for activation');
        document.getElementById('fixtures').append(detached);
        view.frame.activate();
        await settle();
        assert(visible(view) && view.scrolls.length === 1 && timers.size === 1, 'Prepared Home positions once after attachment');
        dispose(view);
        assert(timers.size === 0 && observers.size === 0 && runtimeErrors.length === 0, 'All resources cleaned up without runtime errors');
        window.open = originalOpen;
        view = await mount([event('00:00', 'All day', { allDay: true }), event('09:00', longTitle, { location: longLocation }), event('16:00', 'Afternoon appointment')]);
        view.owner.unload();
        document.getElementById('result').textContent = 'PASS: ' + checks + ' checks of production Calendar source and CSS, static events, headings, Today navigation, zoom, rollover, query states, frame lifecycle, and all palette/theme combinations.';
    } catch (error) {
        document.getElementById('result').textContent = 'FAIL: ' + error.stack;
    }
};
</script>
