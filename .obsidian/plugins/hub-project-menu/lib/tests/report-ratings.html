HTMLElement.prototype.createEl=function(tag,o={}){const e=document.createElement(tag);e.className=o.cls||'';e.textContent=o.text||'';for(const [k,v] of Object.entries(o.attr||{}))e.setAttribute(k,v);this.append(e);return e};

const Report=new Function('hasKeyboardFocus','focusAfterRowRemoval','Modal','PROJECT_ADVANCEMENT_OPTIONS','progressRatingOptions','createImmediateHubTooltip','setIcon','Notice','normalizeFocusItems','createWindowTitle','setWindowUndertext','renderReportWorkspaceHeader','mountTransientEffects','lockModalControls','layoutModal',code+';return ProjectAdvancementModal;')(
 focusRestore.exports.hasKeyboardFocus,focusRestore.exports.focusAfterRowRemoval,Modal,config.exports.PROJECT_ADVANCEMENT_OPTIONS,config.exports.progressRatingOptions,tooltips.exports.createImmediateHubTooltip,()=>{},class{constructor(message){throw Error(message)}},focus.exports.normalizeFocusItems,windowTitle.exports.createWindowTitle,windowTitle.exports.setWindowUndertext,workspaceHeader.exports.renderReportWorkspaceHeader,attention.exports.mountTransientEffects,saveState.exports.lockModalControls,windowTitle.exports.layoutModal);
const project={projectId:'p',name:'Project A',contextKind:'project'},resource={projectId:'resource:study',name:'Knowledge',resourceType:'study'};
const tooltip=()=>document.querySelector('.hub-detail-tooltip');
const hover=button=>button.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerType:'mouse'}));
const leave=button=>button.dispatchEvent(new PointerEvent('pointerout',{bubbles:true,relatedTarget:document.body}));
try{
 for(const editing of [false,true]){
  let saved,savedCalls=0;
  const modal=new Report({}, {projects:[project],resources:[resource],title:editing?'Edit progress report':'Complete progress report',reportMode:editing?'edit':'complete',
   currentScores:{p:1,'resource:study':2},currentSummaries:{p:'Keep project summary','resource:study':'Keep resource summary'},
   showNextFocus:true,focusProjects:[project,resource],currentFocus:[{projectId:'p',projectName:'Project A',text:'Next step'}],
   allowNoProgress:editing,requireEveryProject:!editing,onSave:async value=>{saved=value},onSaved:()=>savedCalls++});
  modal.open();
  const root=modal.contentEl;
  const initial=root.querySelector('.hub-project-advancement-score');
  initial.focus();
  assert(!tooltip(),'Initial modal autofocus never shows guidance, even with focus-visible');
  initial.dispatchEvent(new PointerEvent('pointerover',{bubbles:true,pointerType:'mouse'}));
  assert(!tooltip(),'Opening underneath a stationary pointer does not count as intentional hover');
  initial.blur();
  assert(!root.querySelector('.hub-project-advancement-scale'),'Old visible rubric removed');
  assert(root.querySelector('.hub-window-undertext').textContent===(editing?'Review activity and adjust the significance of work recorded for this date':'Review your activity and rate your work in each project or resource'),'Exact context guidance follows title');
  assert([...root.querySelectorAll('.hub-project-advancement-name')].map(e=>e.textContent).join(',')==='Project A,Knowledge','Workspace ordering and visible titles unchanged');
  for(const [index,workspace] of [project,resource].entries()){
   const row=root.querySelectorAll('.hub-project-advancement-row')[index];
   const buttons=[...row.querySelectorAll('.hub-project-advancement-score')];
   assert(buttons.length===(editing?5:4),'Existing zero-rating availability preserved');
   const bounds=buttons.map(b=>b.getBoundingClientRect()),group=row.querySelector('.hub-project-advancement-choices').getBoundingClientRect();
   assert(bounds.every(b=>Math.abs(b.width-bounds[0].width)<1),'Equal rating button widths');
   assert(Math.abs(bounds[0].left-group.left)<1&&Math.abs(bounds.at(-1).right-group.right)<1,'Ratings fill card width');
   for(const button of buttons){button.click();assert(button.getAttribute('aria-pressed')==='true','All choices select');}

   for(const button of buttons){
    const score=Number(button.dataset.score),definition=config.exports.progressRatingOptions(workspace).find(o=>o.score===score);
    hover(button);
    assert(tooltip()?.querySelector('strong').textContent===`${score} · ${definition.title}`,'Contextual title appears synchronously on hover');
    assert(tooltip().querySelector('.hub-detail-tooltip-description').textContent===definition.description,'Exact contextual explanation');
    assert(!button.hasAttribute('title')&&!button.hasAttribute('aria-label'),'No browser title or competing delayed tooltip');
    assert(document.querySelectorAll('.hub-detail-tooltip').length===1,'Only one tooltip is mounted');
    assert(getComputedStyle(tooltip()).animationName==='none'&&parseFloat(getComputedStyle(tooltip()).transitionDuration)===0,'No appearance animation or delay');
    const rect=tooltip().getBoundingClientRect();assert(rect.left>=0&&rect.right<=innerWidth,'Long explanations fit viewport');
    leave(button);assert(!tooltip(),'Pointer exit removes hover tooltip');
    button.focus();assert(!tooltip(),'Programmatic focus alone never opens a tooltip');button.blur();
    root.dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true}));
    button.focus();assert(tooltip()?.id===button.getAttribute('aria-describedby'),'Intentional visible keyboard focus exposes tooltip immediately');
    button.dispatchEvent(new KeyboardEvent('keyup',{key:'Tab',bubbles:true}));
    button.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));assert(!tooltip(),'Escape dismisses tooltip');
    button.blur();assert(!tooltip(),'Losing keyboard focus closes tooltip');
    button.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'mouse'}));
    button.focus();hover(button);leave(button);
    assert(!tooltip(),'Mouse-focused rating does not keep tooltip open after pointer exit');button.blur();
   }
  }
  modal.summaryInputs.get('p').value='Keep project summary';modal.summaryInputs.get(resource.projectId).value='Keep resource summary';
  const p=root.querySelector('[data-project-id=p]'),r=root.querySelector('[data-project-id="resource:study"]');
  p.querySelector('[data-score="3"]').click();r.querySelector('[data-score="4"]').click();
  assert(modal.selectedScores.get('p')===3&&modal.selectedScores.get(resource.projectId)===4,'Rating selection unchanged');
  assert(p.querySelector('[data-score="3"]').getAttribute('aria-pressed')==='true','Pressed state preserved');
  if(editing){p.querySelector('[data-score="0"]').click();assert(modal.summaryInputs.get('p').value==='','Zero still clears previous summary')}
  hover(r.querySelector('[data-score="4"]'));await modal.save();
  assert(!tooltip()&&savedCalls===1,'Saving closes tooltip and modal exactly once');
  assert(saved.scores[resource.projectId]===4&&(editing?!('p' in saved.scores):saved.scores.p===3),'Stored score semantics unchanged');
  assert(saved.summaries[resource.projectId]==='Keep resource summary'&&saved.focus[0].text==='Next step','Summaries and focus persist unchanged');
 }
 // Exit-only rating validation: zero, one and several missing choices.
 assert((source.match(/requireExplicitRatings: true/g)||[]).length===1,'Only exit entry point opts into validation');
 for(const missingCount of [0,1,3]){
  const workspaces=Array.from({length:3},(_,i)=>({projectId:'w'+i,name:'Workspace '+i}));
  let saved,calls=0;
  const scores=Object.fromEntries(workspaces.slice(missingCount).map(w=>[w.projectId,2]));
  const exit=new Report({}, {projects:workspaces,currentScores:scores,allowNoProgress:true,requireExplicitRatings:true,onSave:async value=>{saved=value;calls++}});exit.open();
  assert(!exit.saveButton.disabled,'Exit save remains clickable to show validation');
  assert(exit.saveButton.getAttribute('aria-disabled')===String(!!missingCount),'Missing ratings mark the exit action visually unavailable');
  const oath=document.body.createDiv({cls:'hub-oath-actions'}),reference=oath.createEl('button',{cls:'mod-cta hub-guided-submit',attr:{'aria-disabled':'true'}});
  if(missingCount)assert(getComputedStyle(exit.saveButton).opacity===getComputedStyle(reference).opacity,'Exit action reuses Review Oath dimming');oath.remove();
  const rows=[...exit.contentEl.querySelectorAll('.hub-project-advancement-row')];
  rows.forEach(row=>assert(row.querySelector('textarea').placeholder==='Comments\u2026','Optional comments placeholder'));
  if(missingCount){
   rows[0].querySelector('textarea').value='Optional comments cannot satisfy a rating';
   exit.saveButton.click();await new Promise(requestAnimationFrame);
   assert(calls===0&&!exit.settled,'Missing explicit ratings prevent save and close');
   assert(exit.contentEl.querySelectorAll('.hub-attention').length===missingCount,'Only missing rows highlighted');
   for(const group of exit.contentEl.querySelectorAll('.hub-attention')){
    const animation=group.getAnimations()[0];if(animation){animation.pause();animation.currentTime=450;}
    assert(parseFloat(getComputedStyle(group,'::after').opacity)>.5,'Yellow validation paint is visible');
    assert(group.querySelectorAll('[data-hub-attention-surface]').length===5,'All five rating surfaces receive shared yellow treatment');
   }
   for(const row of rows){assert(!row.classList.contains('hub-attention')&&!row.querySelector('textarea').hasAttribute('data-hub-attention-surface'),'Card and comments never highlighted');}
   for(let i=0;i<missingCount;i++){
    const row=rows[i],choice=row.querySelector('[data-score="'+i+'"]');choice.click();
    assert(!row.querySelector('.hub-project-advancement-rating-buttons').classList.contains('hub-attention')&&!row.querySelector('[aria-invalid]'),'Selection including zero clears warning immediately');
    assert(choice.getAttribute('aria-pressed')==='true','Explicit zero and positive choices visibly selected');
   }
  }
  assert(exit.saveButton.getAttribute('aria-disabled')==='false'&&getComputedStyle(exit.saveButton).opacity==='1','All ratings restore normal purple action');
  await exit.save();assert(calls===1&&exit.settled,'Complete ratings save once with optional blank comments');
  assert(!('w0' in saved.scores)||missingCount===0,'Explicit zero preserves existing persistence fallback');
 }
 for(const score of [0,1,2,3,4]){
  let saved;const modal=new Report({}, {projects:[project],currentScores:{},allowNoProgress:true,requireExplicitRatings:true,onSave:async value=>saved=value});modal.open();
  const button=modal.contentEl.querySelector('[data-score="'+score+'"]');assert(!button.classList.contains('is-selected'),'Unrated starts unselected');button.click();
  assert(button.classList.contains('is-selected')&&getComputedStyle(button).backgroundColor==='rgb(137, 85, 237)','All five selections use purple');
  await modal.save();assert(score===0?!('p' in saved.scores):saved.scores.p===score,'All five saved rating choices preserve semantics');
 }
 // Manual editor still allows unrated workspaces and preserves fallback behavior.
 let manualSaved;const manual=new Report({}, {projects:[project],currentScores:{p:0},allowNoProgress:true,requireEveryProject:false,onSave:async value=>manualSaved=value});manual.open();
 assert(!manual.contentEl.querySelector('.is-selected'),'Stored zero fallback remains visually unselected');await manual.save();assert(manualSaved&&!manualSaved.scores.p,'Manual editing has no exit validation');
 const external=document.body.appendChild(document.createElement('button'));tooltips.exports.setHubTooltip(external,'Ordinary delayed tooltip');hover(external);
 assert(!tooltip()&&external.getAttribute('aria-label')==='Ordinary delayed tooltip','Unrelated tooltip mechanism unchanged');
 const modal=new Report({}, {projects:[project],resources:[resource],currentScores:{},allowNoProgress:true,onSave:async()=>{}});modal.open();
 const button=modal.contentEl.querySelector('[data-score="4"]');hover(button);modal.close();hover(button);
 assert(!tooltip(),'Modal close disposes tooltip and delegated listeners');
 // Leave a representative Resource tooltip for visual inspection.
 const sample=new Report({}, {projects:[project],resources:[resource],title:"Today's progress report",currentScores:{},allowNoProgress:true,onSave:async()=>{}});sample.open();
 hover(sample.contentEl.querySelector('[data-project-id="resource:study"] [data-score="4"]'));
 result.textContent='PASS: shared creation/editing modal; exact contextual 0–4 definitions, synchronous hover/focus, compact native tooltip surface, unchanged selection/summary/focus/save semantics, exit-only validation for zero/one/several missing ratings, immediate warning clearing including zero, optional comments, all five saved choices, equal full-width buttons, cleanup and unrelated tooltip isolation.';
}catch(error){result.textContent='FAIL '+error.stack}
